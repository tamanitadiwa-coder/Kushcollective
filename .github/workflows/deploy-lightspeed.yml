name: Deploy Lightspeed connection

on:
  push:
    branches: [main]
    paths:
      - 'integration/worker/**'
      - '.github/workflows/deploy-lightspeed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy-lightspeed

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare is not set up yet (add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets). Tests passed; nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.cf.outputs.ready == 'true'
        run: npm ci

      - name: Database (free D1)
        if: steps.cf.outputs.ready == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='kush-lightspeed');process.stdout.write(d?(d.uuid||d.id||''):'')"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create kush-lightspeed >/dev/null; ID=$(find_id); fi
          if [ -z "$ID" ]; then echo "::error::Could not find or create the D1 database"; exit 1; fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx wrangler d1 execute kush-lightspeed --remote --file schema.sql

      - name: Deploy Worker
        if: steps.cf.outputs.ready == 'true'
        run: |
          EXTRA=""
          if [ "${{ vars.LIGHTSPEED_MODE }}" = "live" ]; then EXTRA="--var MOCK_LIGHTSPEED:false"; fi
          npx wrangler deploy $EXTRA 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: Secrets
        if: steps.cf.outputs.ready == 'true'
        env:
          KUSH_MANAGER_PASSCODE: ${{ secrets.KUSH_MANAGER_PASSCODE }}
          LIGHTSPEED_CLIENT_ID: ${{ secrets.LIGHTSPEED_CLIENT_ID }}
          LIGHTSPEED_CLIENT_SECRET: ${{ secrets.LIGHTSPEED_CLIENT_SECRET }}
        run: |
          EXIST=$(npx wrangler secret list 2>/dev/null || echo "[]")
          has() { echo "$EXIST" | grep -q "\"$1\""; }
          # Generated once and never shown to anyone. Never regenerated (stored tokens depend on TOKEN_KEY).
          has TOKEN_KEY   || openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put TOKEN_KEY
          has SESSION_KEY || openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SESSION_KEY
          [ -n "$KUSH_MANAGER_PASSCODE" ]   && printf '%s' "$KUSH_MANAGER_PASSCODE"   | npx wrangler secret put MANAGER_PASSCODE
          [ -n "$LIGHTSPEED_CLIENT_ID" ]     && printf '%s' "$LIGHTSPEED_CLIENT_ID"     | npx wrangler secret put LS_CLIENT_ID
          [ -n "$LIGHTSPEED_CLIENT_SECRET" ] && printf '%s' "$LIGHTSPEED_CLIENT_SECRET" | npx wrangler secret put LS_CLIENT_SECRET
          [ -z "$KUSH_MANAGER_PASSCODE" ] && echo "::warning::KUSH_MANAGER_PASSCODE secret is not set, so nobody can sign in to the Lightspeed page yet."
          true

      - name: Point the app at the Worker
        if: steps.cf.outputs.ready == 'true' && env.URL != ''
        working-directory: .
        run: |
          printf "// Address of the Lightspeed connection service (Cloudflare Worker).\n// Filled in automatically by the \"Deploy Lightspeed connection\" GitHub workflow. Empty = not set up yet.\nwindow.KUSH_LS_API = '%s';\n" "$URL" > kush-config.js
          if ! git diff --quiet kush-config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Point Kush at the Lightspeed connection service"
            git push
          fi
          {
            echo "### Lightspeed connection deployed"
            echo "- Service: $URL"
            echo "- Redirect URI to register with Lightspeed: \`$URL/oauth/callback\`"
            echo "- Mode: ${{ vars.LIGHTSPEED_MODE == 'live' && 'live' || 'test (mock)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
