<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Kush Collective – Staff Portal</title>

<style>
:root{--g:#1f7a4d;--gd:#14532d;--gl:#e8f4ec;--bg:#fff;--bg2:#f6faf7;--tx:#16241c;--mu:#667a6e;--bd:#dbe7de;--rd:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;color:var(--gd)}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font:700 22px Fraunces,serif}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:linear-gradient(#fff,var(--gl))}
#login .logo{width:110px;height:110px;font-size:52px}
.pin{display:flex;gap:10px}.pin input{width:200px;text-align:center;font-size:26px;letter-spacing:10px;padding:12px;border:1.5px solid var(--bd);border-radius:12px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;z-index:5}
header h2{font-size:18px;flex:1}header small{color:var(--mu)}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;padding:9px 14px;border-radius:999px;font:500 14px 'DM Sans';color:var(--mu);white-space:nowrap;cursor:pointer}
nav button.on{background:var(--g);color:#fff}
main{padding:16px;max-width:980px;margin:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
button.b,select,input,textarea{font:inherit}
.b{background:var(--g);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer}
.b.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}.b.d{background:#fff;color:var(--rd);border:1.5px solid var(--rd)}.b.s{padding:6px 10px;font-size:13px}
select,input[type=text],input[type=number],input[type=password]{border:1.5px solid var(--bd);border-radius:9px;padding:9px 10px;background:#fff;max-width:100%}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--gl);color:var(--gd);text-align:left;padding:10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--bd)}td input[type=number]{width:84px}
.low{color:var(--rd);font-weight:700}.ok{color:var(--g);font-weight:700}.pos{color:var(--g)}.neg{color:var(--rd)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px}.card b{font:700 28px Fraunces,serif;color:var(--gd);display:block}
.mu{color:var(--mu);font-size:13px}.hide{display:none!important}
.chk{width:22px;height:22px;accent-color:var(--g)}
dialog{border:0;border-radius:16px;padding:20px;max-width:420px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,.25);color:var(--tx)}dialog::backdrop{background:rgba(20,40,28,.45)}
dialog label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}dialog input{width:100%}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}#toast.err{background:var(--rd)}.req{border-color:var(--rd)!important;background:#fff5f4}
.stamp{display:inline-flex;align-items:center;background:var(--gl);color:var(--gd);padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px}
tr.band td{background:var(--g);color:#fff;font-weight:700;padding:9px 10px;letter-spacing:.3px}
.big{display:grid;gap:12px;margin-top:14px}.big button{display:block;width:100%;text-align:left;border:1.5px solid var(--bd);border-left:6px solid var(--g);background:#fff;border-radius:16px;padding:18px;cursor:pointer;font:inherit}
.big button b{display:block;font:700 22px Fraunces,serif;color:var(--gd);margin-bottom:2px}.big button span{color:var(--mu);font-size:14px}.big button span.ok{color:var(--g)}.big button span.low{color:var(--rd)}
.seg{display:flex;gap:6px;margin:12px 0;overflow-x:auto}.seg button{border:1.5px solid var(--bd);background:#fff;color:var(--mu);padding:9px 16px;border-radius:999px;font:500 14px 'DM Sans';cursor:pointer;white-space:nowrap}.seg button.on{background:var(--g);border-color:var(--g);color:#fff}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.slides::-webkit-scrollbar{display:none}.slides>section{flex:0 0 100%;scroll-snap-align:start;min-width:0;padding:2px 2px 20px}
.day{border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}.day.today{border-color:var(--g);background:var(--bg2)}.day.off{opacity:.65}
.dh{font:700 17px Fraunces,serif;color:var(--gd);display:flex;justify-content:space-between;align-items:center}.dh em{font:700 11px 'DM Sans';background:var(--g);color:#fff;border-radius:999px;padding:3px 9px}
.sh{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}.dh+.sh{border-top:0;padding-top:0;margin-top:8px}
.sh .t{font-weight:700;font-size:17px;display:flex;justify-content:space-between}.sh .t span{color:var(--mu);font-weight:500;font-size:14px}.sh .st{color:var(--g);font-weight:700;font-size:14px}.sh .wm{font-size:14px;margin-top:2px}
.store{margin-bottom:18px}.store h4{margin:0 0 8px;font:700 18px Fraunces,serif;color:var(--gd)}
.grid td,.grid th{white-space:nowrap;font-size:13px}.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:#fff;font-weight:700;z-index:1}.grid th:first-child{background:var(--gl)}.grid tr.me td{background:#d9efe0}
.av{width:78px;height:78px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font:700 34px Fraunces,serif;margin:0 auto 8px}
@media print{header,nav,.bar,.noprint{display:none!important}}
</style></head><body>

<div id="login">
  <div class="logo" data-logo>K</div>
  <h1>Kush Collective</h1><div class="mu">Staff portal · enter your code</div>
  <div id="lockbox" class="card hide" style="max-width:380px;text-align:center;color:var(--rd)"></div>

<script>
const LOGO="https://i0.wp.com/kushcannabiscollective.com/wp-content/uploads/2025/11/kush-logo-V2.png?fit=512%2C512&ssl=1";
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const STOCK_LIST=[

['Greenhouse 1G',['Candyland','Zsunami','Dom Perignon','Original Z','Menthol','Ice cream cake','Moonshining haze','Kush Mintz','Jealousy','Caribbean Breeze','Superberry','Hindu Kush','Green crack','Lemon Tangerine','Thin Mintz']],

['Awaken 2ml',['Fuji Sugar','Sour Slapper','Durban Diesel','Amnesia Mountain','Travelers','Apple Sauce','Sorbet Guava','Juice box Grape','Double Rainbow','Yuzu Sherbet','Island Punch','Orange pop','Tiger Melon']],
['Cartridges',['White Widow','Gelato','Pineapple kush','Chemdog','Tropic Thunder','Lemon haze','Forbidden Fruit','Orange Soda']],
['Happy Hits',['Raspberry','Watermelon','Sour Lemon']],
['Native',['Neon Nerds','Lemonada','Kingstart','Grape rock candy','Boof scotti','Dosidos','Cookies and Cream','Shortcake','Mad Ghost','Lemon zoap','Sour Deisel','Super saiyan','Pine Apple express']],
['Lifted',['Fudge','Cookies','Love Bites','Gummy Bears','Heart Stopper','Loaded Gummies','Fruit Pastilles','Wacky Worms','Red Vines','Rainbow Strips','OG Gummies','Share Squares']],
['High Sweety',['Jars','Share Squares','Teddy Bears','Buzz Bolts','Lucky Dice','Rainbow Strips','Smileys','Salted Caramel','Fruity Chews','Lucky Leaves','Ying & yangs','Sour Worms','High Rollers','Peacemakers','Happy420','Lift','Muse','Calm','Slap','Whack']],
['Backwood',['Russian Cream','Single Russian cream']]];
const SCHED_SEED=[
['Albany Muse',{Mon:'Tallyn 09:30-16:30,Josh 09:30-16:30,Boyd 16:30-00:00,Jamal 16:30-00:00',
 Tue:'Ashley 09:30-16:30,Tallyn 09:30-16:30,Jamal 16:30-00:00,Gino 16:30-00:00',
 Wed:'Josh 09:30-16:30,Tallyn 09:30-16:30,Ashley 16:30-00:00,Boyd 16:30-00:00',
 Thu:'Ashley 09:30-16:30,Jamal 09:30-16:30,Matt 16:30-00:00,Boyd 16:30-00:00',
 Fri:'Tallyn 09:30-17:00,Josh 09:30-17:00,Jamal 17:00-01:00,Matt 17:00-01:00',
 Sat:'Boyd 09:30-17:00,Ashley 09:30-17:00,Kush 17:00-01:00,Jamal 17:00-01:00',
 Sun:'Blessing 09:30-16:30,Ashley 09:30-16:30,Tallyn 16:30-00:00,Boyd 16:30-00:00'}],
['St John',{Mon:'Kush 08:30-16:30,Gwyn 16:30-23:30,Matt 16:30-23:30',
 Tue:'Gwyn 08:30-16:30,Blessing 16:30-23:30,Matt 16:30-23:30',
 Wed:'Gwyn 08:30-16:30,Blessing 16:30-23:30,Gino 16:30-23:30',
 Thu:'Kush 08:30-16:30,Gino 16:30-23:30,Gwyn 16:30-23:30',
 Fri:'Gino 08:30-16:30,Kush 16:30-23:30,Blessing 16:30-23:30',
 Sat:'Gwyn 08:30-16:30,Blessing 16:30-23:30,Matt 16:30-23:30',
 Sun:'Kush 08:30-16:30,Gino 16:30-23:30'}]];
function defaultSched(){return{stores:SCHED_SEED.map((x,k)=>({id:k+1,name:x[0],days:Object.fromEntries(DAYS.map(d=>[d,(x[1][d]||'').split(',').filter(Boolean).map(t=>{const m=t.trim().split(/[ -]/);return{p:m[0],s:m[1],e:m[2]}})]))}))}}
const seed=()=>migrate({pins:{admin:'1234',staff:''},items:[],log:[],staff:[],nid:1,drafts:{},lastShort:null,lastCount:null});
let S,U=null,tab='dash',mode='Closing count';
let storeOK=true,hf='All';
function newCode(d){const used=new Set([d.pins.admin].concat(d.staff.map(x=>x.code)));let c;do{c=String(1000+Math.floor(Math.random()*9000))}while(used.has(c));return c}
function applyStockList(d){const OLD=['Flower – House Blend','Flower – Premium A','Flower – Premium B','Pre-rolls','Rolling papers','Filter tips','Grinders','Lighters','Water','Cooldrink'];
 const used=new Set(),out=[];
 STOCK_LIST.forEach(([cat,names])=>names.forEach(n=>{let it=d.items.find(i=>!used.has(i.id)&&i.name.toLowerCase()===n.toLowerCase()&&String(i.cat||'').toLowerCase()===cat.toLowerCase());
  if(!it)it={id:d.nid++,name:n,cat,unit:'',par:0,qty:0};used.add(it.id);out.push(it)}));
 d.items.forEach(i=>{if(used.has(i.id))return;
  const untouched=OLD.includes(i.name)&&i.qty===0&&!d.log.some(l=>l.item===i.name)&&!Object.values(d.drafts).some(x=>x&&x.v&&x.v[i.id]!==undefined&&x.v[i.id]!=='');
  if(!untouched)out.push(i)});
 d.items=out;d.stockListV=1}
function migrate(d){
 if(!d||typeof d!=='object'||!Array.isArray(d.items))return null;
 const n0=v=>isNaN(parseFloat(v))?0:parseFloat(v);
 d.pins=Object.assign({admin:'1234',staff:''},d.pins||{});
 d.log=Array.isArray(d.log)?d.log:[];d.staff=Array.isArray(d.staff)?d.staff:[];
 d.drafts=d.drafts&&typeof d.drafts==='object'?d.drafts:{};d.lastShort=d.lastShort||null;d.lastCount=d.lastCount||null;
 let mx=0;const seen=new Set();
 d.items.forEach(i=>{if(i.id==null||seen.has(i.id))i.id=null;else{seen.add(i.id);mx=Math.max(mx,n0(i.id))}});
 d.items.forEach(i=>{if(i.id==null){i.id=++mx;seen.add(i.id)}i.name=String(i.name==null?'Item':i.name);i.cat=i.cat||'Other';i.unit=i.unit==null?'pcs':String(i.unit);i.par=n0(i.par);i.qty=n0(i.qty)});
 d.nid=Math.max(n0(d.nid),mx+1);
 d.staff.forEach(x=>{x.name=String(x.name==null?'':x.name);if(!Array.isArray(x.days))x.days=[];while(x.days.length<7)x.days.push(false)});
 d.log.forEach(l=>{if(l.type==='Stock intake')l.type='Stock received'});
 if(d.sched===undefined)d.sched=defaultSched();
 if(!d.sched||!Array.isArray(d.sched.stores))d.sched={stores:[]};
 let sid=0;d.sched.stores.forEach(st=>{st.name=String(st.name||'Store');st.days=st.days||{};DAYS.forEach(k=>{if(!Array.isArray(st.days[k]))st.days[k]=[]});sid=Math.max(sid,n0(st.id))});
 d.sched.stores.forEach(st=>{if(!st.id)st.id=++sid});
 const have=new Set(d.staff.map(x=>x.name.toLowerCase()));
 d.sched.stores.forEach(st=>DAYS.forEach(k=>st.days[k].forEach(x=>{if(!have.has(x.p.toLowerCase())){have.add(x.p.toLowerCase());d.staff.push({name:x.p,days:Array(7).fill(false)})}})));
 d.staff.forEach(x=>{if(!x.code)x.code=newCode(d)});
 if(!d.stockListV)applyStockList(d);
 d.v=DATA_V;return d}
let locked=false;
function loadS(){let raw=null;
 for(const k of ['kush_v2','kush']){try{const r=localStorage.getItem(k);if(r){raw=r;break}}catch(e){}}
 if(raw===null){try{if(window.name.startsWith('KUSH:'))raw=window.name.slice(5)}catch(e){}}
 if(raw===null)return null;
 try{const o=JSON.parse(raw);
  if((o.v||0)<DATA_V){try{if(!localStorage.getItem('kush_before_update_v'+DATA_V))localStorage.setItem('kush_before_update_v'+DATA_V,raw)}catch(e){}}
  const d=migrate(o);if(d)return d}catch(e){}
 try{localStorage.setItem('kush_unreadable_copy',raw)}catch(e){}
 locked=true;return null}
S=loadS();
S=S||seed();
function save(){if(locked)return;const j=JSON.stringify(S);let ok=false;
 try{localStorage.setItem('kush_v2',j);ok=localStorage.getItem('kush_v2')===j}catch(e){}
 try{window.name='KUSH:'+j}catch(e){}
 storeOK=ok;if(ok)snap();badge()}
let lastSnap=0;
function snap(){if(Date.now()-lastSnap<60000)return;lastSnap=Date.now();try{const d=new Date().toISOString().slice(0,10);let a=JSON.parse(localStorage.getItem('kush_snaps')||'[]');
 if(a.length&&a[a.length-1].d===d)a[a.length-1].j=JSON.stringify(S);else{a.push({d,j:JSON.stringify(S)});while(a.length>7)a.shift()}
 localStorage.setItem('kush_snaps',JSON.stringify(a))}catch(e){}}
function badge(){const b=$('sv');if(!b)return;b.textContent=storeOK?'Saved '+hm():'Not saving';b.className=storeOK?'ok':'low'}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='Kush-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=migrate(JSON.parse(r.result));if(!d)throw 0}catch(e){toast('That file is not a Kush backup',1);return}
 ask('Restore this backup?','All current data is replaced by the backup.',()=>{S=d;locked=false;save();$('lockbox').classList.add('hide');if(U)draw();toast('Backup restored')},'Restore')};r.readAsText(f)}
function snapList(){let a=[];try{a=JSON.parse(localStorage.getItem('kush_snaps')||'[]')}catch(e){}
 const out=a.map((x,i)=>({k:'s'+i,label:'Automatic snapshot · '+x.d,j:x.j})).reverse();
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('kush_before_update')===0)out.push({k:'b'+k,label:'Copy taken before an update ('+k.replace('kush_before_update','').replace('_v',' v').trim()+')',j:localStorage.getItem(k)})}}catch(e){}
 return out}
function restoreSnap(k){const x=snapList().find(y=>y.k===String(k));let d;try{d=migrate(JSON.parse(x.j))}catch(e){}if(!d){toast('That snapshot is unreadable',1);return}
 ask('Restore '+x.label+'?','Current data is replaced. Download a backup first if unsure.',()=>{S=d;locked=false;save();draw();toast('Snapshot restored')},'Restore')}
function showLock(){const b=$('lockbox');b.classList.remove('hide');
 b.innerHTML='<b>Saved data could not be read.</b><div class="mu" style="margin:6px 0">Nothing has been deleted and saving is paused to protect it. Restore a backup file, or start fresh. A copy of the unreadable data is kept on this device.</div><div class="bar" style="justify-content:center"><label class="b o s">Restore backup file<input type="file" accept=".json" class="hide" onchange="restore(this.files[0])"></label><button class="b d s" onclick="startFresh()">Start fresh</button></div>'}
function startFresh(){ask('Start fresh?','This begins with empty defaults. The unreadable copy stays on this device.',()=>{locked=false;S=seed();save();$('lockbox').classList.add('hide');toast('Started fresh')},'Start fresh')}
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>isNaN(parseFloat(v))?0:parseFloat(v);

// logo with fallback to the "K" mark
const im=new Image();im.onload=()=>document.querySelectorAll('[data-logo]').forEach(e=>{e.innerHTML='';const i=im.cloneNode();i.style.cssText='width:100%;height:100%;border-radius:50%;object-fit:cover';e.style.background='none';e.appendChild(i)});im.src=LOGO;

function toast(m,err){const t=$('toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)}
function form(title,fields,onOk,okText){const d=$('dlg');
 d.innerHTML=`<h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.label)}</label><input id="f_${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="any" min="0" inputmode="decimal"':''} ${f.list?'list="'+f.list+'"':''} value="${esc(f.val==null?'':f.val)}">`).join('')}
 <datalist id="cats">${[...new Set(S.items.map(i=>i.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="rost">${S.staff.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
 <div class="bar" style="margin-top:18px"><button class="b" id="fok">${esc(okText||'Save')}</button><button class="b o" id="fno">Cancel</button></div>`;
 d.showModal();$('fno').onclick=()=>d.close();
 $('fok').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('f_'+f.k).value.trim());if(onOk(v)!==false)d.close()}}
function ask(title,body,onOk,okText){const d=$('dlg');
 d.innerHTML=`<h3>${esc(title)}</h3><p class="mu" style="font-size:14px">${esc(body||'')}</p><div class="bar" style="margin-top:18px"><button class="b" id="fok">${esc(okText||'Yes')}</button><button class="b o" id="fno">Cancel</button></div>`;
 d.showModal();$('fno').onclick=()=>d.close();$('fok').onclick=()=>{d.close();onOk()}}
function login(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 const p=$('pin').value.trim();
 if(p&&p===S.pins.admin)U={n:'Admin',admin:1};
 else{const st=p&&S.staff.find(x=>x.code===p);if(st)U={n:st.name,admin:0,me:st.name};else{$('err').textContent='Code not recognised';return}}
 $('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=U.n;$('pin').value='';tab=U.admin?'home':'shifts';ssl=U.admin?1:0;vas='';try{sessionStorage.setItem('kushU',JSON.stringify(U))}catch(e){}draw()}
function logout(){U=null;try{sessionStorage.removeItem('kushU')}catch(e){}$('app').classList.add('hide');$('login').classList.remove('hide');$('err').textContent=''}
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

const GROUP={home:'home',dash:'stock',recv:'stock',count:'stock',short:'stock',stock:'stock',log:'stock',shifts:'shifts',sched:'shifts',admin:'admin'};
const TABS=[['dash','Overview'],['recv','Stock received'],['count','Count sheet'],['short','Short list'],['stock','Stock'],['log','History']];
function draw(){
 if((tab==='admin'||tab==='sched')&&!U.admin)tab='home';
 const st=GROUP[tab]==='stock';
 $('nav').classList.toggle('hide',!st);
 $('nav').innerHTML=st?TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join(''):'';
 $('hb').classList.toggle('hide',tab==='home');
 $('main').innerHTML=(storeOK?'':'<div class="card low" style="margin-bottom:12px">This device or app is blocking saving, so data will be lost when you close the page. Open this file in Chrome or Safari, or use Backup in Admin.</div>')+({home,dash,count,recv,short,stock,shifts,sched,log:hist,admin})[tab]();
 if(tab==='count')S.items.forEach(i=>calc(i.id));
 if(tab==='shifts')slideTo();
 badge();tickClk();
}
const nk=i=>esc((i.name+' '+i.cat).toLowerCase());
function bands(f,cols){let last=null,h='';S.items.forEach(i=>{if(i.cat!==last){last=i.cat;h+=`<tr class="band" data-b="1"><td colspan="${cols}">${esc(i.cat)}</td></tr>`}h+=f(i)});return h}
function filt(v){v=v.toLowerCase().trim();document.querySelectorAll('tr[data-n],tr[data-b]').forEach(r=>{if(r.dataset.b){r.style.display=v?'none':''}else{const show=!v||r.dataset.n.includes(v);r.style.display=show?'':'none';if(show&&v){let q=r.previousElementSibling;while(q&&!q.dataset.b)q=q.previousElementSibling;if(q)q.style.display=''}}})}
const low=i=>i.qty<i.par*0.25;

function dash(){const L=S.items.filter(low);
 return `${todayCard()}<h3>How it works</h3><div class="cards" style="margin:12px 0 20px">
 <div class="card" onclick="tab='recv';draw()" style="cursor:pointer"><b>1</b>Receive stock<div class="mu">Log every delivery. Use Opening balance for what you already have.</div></div>
 <div class="card" onclick="tab='count';draw()" style="cursor:pointer"><b>2</b>Count at shift<div class="mu">Opening and closing counts. Variances are logged.</div></div>
 <div class="card" onclick="tab='short';draw()" style="cursor:pointer"><b>3</b>Check short list<div class="mu">See what to reorder and what went missing.</div></div></div>
 <h3>Overview</h3><div class="bar"></div><div class="cards">
 <div class="card"><b>${S.items.length}</b><span class="mu">Products</span></div>
 <div class="card"><b>${L.length}</b><span class="mu">Low stock</span></div>
 <div class="card"><b>${S.log.length}</b><span class="mu">Log entries</span></div></div>
 <h3 style="margin-top:20px">Needs reorder</h3>
 ${L.length?`<div class="tw"><table><tr><th>Item</th><th>On hand</th><th>Par</th></tr>${L.map(i=>`<tr><td>${esc(i.name)}</td><td class="low">${i.qty} ${i.unit}</td><td>${i.par}</td></tr>`).join('')}</table></div>`:'<p class="mu">Nothing is running low.</p>'}
 <div class="bar"><button class="b" onclick="tab='recv';draw()">Stock received</button><button class="b o" onclick="tab='count';draw()">Count sheet</button></div>`}

function dk(){return S.drafts[mode]=S.drafts[mode]||{v:{},note:''}}
const hm=()=>new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
function tickClk(){document.querySelectorAll('.clk').forEach(e=>e.textContent=nowD()+'  ·  '+nowT())}
function count(){const d=dk();
 return `<h3>Count sheet</h3>${todayCard()}
 <div class="bar"><select onchange="mode=this.value;draw()">${['Opening count','Closing count'].map(m=>`<option ${m===mode?'selected':''}>${m}</option>`).join('')}</select><span class="stamp clk"></span></div>
 <p class="mu">Date and time are added automatically. Type the names of both people doing this stock take.</p>
 <div class="bar"><input id="p1" list="stf" type="text" placeholder="Counted by – person 1" value="${esc(d.p1||'')}" oninput="dk().p1=this.value;this.classList.remove('req');save()">
 <input id="p2" list="stf" type="text" placeholder="Counted by – person 2" value="${esc(d.p2||'')}" oninput="dk().p2=this.value;this.classList.remove('req');save()"></div>
 <datalist id="stf">${S.staff.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
 <div class="bar"><input type="text" placeholder="Search products" oninput="filt(this.value)" style="flex:1"></div>
 <div class="tw"><table><tr><th>Item</th><th>System</th><th>Counted</th><th>Variance</th></tr>
 ${bands(i=>`<tr data-n="${nk(i)}"><td>${esc(i.name)}</td><td>${i.qty}</td>
 <td><input type="number" step="any" min="0" inputmode="decimal" id="c${i.id}" value="${d.v[i.id]??''}" oninput="cin(${i.id},this.value)"></td><td id="v${i.id}">–</td></tr>`,4)||'<tr><td colspan="4" class="mu">No products yet. An admin can add them under Stock.</td></tr>'}</table></div>
 <div class="bar"><input type="text" id="note" placeholder="Note (optional)" value="${esc(d.note||'')}" oninput="dk().note=this.value;save()" style="flex:1;min-width:160px"></div>
 <div class="bar"><button class="b o" onclick="saveDraft()">Save draft</button><button class="b" onclick="completeCount()">Complete stock take</button>
 <button class="b o" onclick="exportCount()">Download sheet</button><button class="b o" onclick="print()">Print</button></div>
 <div class="mu" id="ds">${d.saved?'Draft saved '+d.saved:''}</div>${shiftPicker()}`}
function cin(id,v){dk().v[id]=v;save();calc(id)}
function calc(id){const i=S.items.find(x=>x.id===id),r=$('c'+id);if(!r||!i)return;const el=$('v'+id);
 if(r.value===''){el.textContent='–';el.className='';return}
 const d=num(r.value)-i.qty;el.textContent=(d>0?'+':'')+d+(d<0?' short':'');el.className=d<0?'neg':d>0?'pos':''}
function names(){const d=dk(),a=(d.p1||'').trim(),b=(d.p2||'').trim();
 if(!a||!b){if(!a)$('p1').classList.add('req');if(!b)$('p2').classList.add('req');toast('Type the names of both people first',1);$(!a?'p1':'p2').focus();return null}
 if(a.toLowerCase()===b.toLowerCase()){$('p2').classList.add('req');toast('Person 1 and person 2 must be different people',1);$('p2').focus();return null}
 return [a,b]}
function saveDraft(){const n=names();if(!n)return;const d=dk();d.saved=nowD()+' '+nowT();save();$('ds').textContent='Draft saved '+d.saved;toast('Draft saved')}
function completeCount(){const n=names();if(!n)return;const d=dk(),has=i=>d.v[i.id]!==undefined&&d.v[i.id]!=='';
 if(S.items.some(i=>has(i)&&num(d.v[i.id])<0)){toast('Counts cannot be negative',1);return}
 const ids=S.items.filter(has);if(!ids.length){toast('Enter at least one count first',1);return}
 const miss=S.items.length-ids.length;
 ask('Complete this '+mode.toLowerCase()+'?',(miss?miss+' uncounted items will stay unchanged. ':'')+'Counted by '+n[0]+' and '+n[1]+'.',()=>{
  const dd=nowD(),tm=nowT(),t=dd+' '+tm,sh=[],all=[];
  ids.forEach(i=>{const b=i.qty,v=num(d.v[i.id]);i.qty=v;
   S.log.push({t,d:dd,tm,type:mode,user:U.n,p1:n[0],p2:n[1],cat:i.cat,iid:i.id,item:i.name,before:b,after:v,delta:v-b,note:d.note||''});
   all.push({item:i.name,cat:i.cat,unit:i.unit,par:i.par,system:b,counted:v});if(v<b)sh.push({item:i.name,unit:i.unit,system:b,counted:v,short:b-v})});
  S.lastShort={t,d:dd,tm,type:mode,p1:n[0],p2:n[1],rows:sh};S.lastCount={d:dd,tm,type:mode,p1:n[0],p2:n[1],note:d.note||'',rows:all};
  delete S.drafts[mode];save();tab='short';draw();toast('Stock take saved')},'Complete stock take')}

function recv(){const d=S.drafts.recv=S.drafts.recv||{v:{},ref:'',sup:''};
 return `<h3>Stock received</h3><p class="mu">Log a delivery. Quantities are added to stock when you complete. Date and time are added automatically.</p>
 <div class="bar"><span class="stamp clk"></span></div>
 <div class="bar"><select onchange="S.drafts.recv.type=this.value;save()">${['Delivery','Opening balance'].map(t=>`<option ${(d.type||'Delivery')===t?'selected':''}>${t}</option>`).join('')}</select>
 <input type="text" placeholder="Supplier" value="${esc(d.sup||'')}" oninput="S.drafts.recv.sup=this.value;save()">
 <input type="text" placeholder="Invoice / delivery ref" value="${esc(d.ref||'')}" oninput="S.drafts.recv.ref=this.value;save()"></div>
 <div class="bar"><input type="text" placeholder="Search products" oninput="filt(this.value)" style="flex:1"></div>
 <div class="tw"><table><tr><th>Item</th><th>On hand</th><th>Received</th><th>New total</th></tr>
 ${bands(i=>{const r=d.v[i.id]??'';return `<tr data-n="${nk(i)}"><td>${esc(i.name)}</td><td>${i.qty}</td>
 <td><input type="number" step="any" min="0" inputmode="decimal" value="${r}" oninput="rin(${i.id},this.value)"></td><td id="r${i.id}">${r===''?'–':i.qty+num(r)}</td></tr>`},4)||'<tr><td colspan="4" class="mu">No products yet. An admin can add them under Stock.</td></tr>'}</table></div>
 <div class="bar"><button class="b o" onclick="saveRecv()">Save draft</button><button class="b" onclick="completeRecv()">Complete stock received</button></div>
 <div class="mu" id="rs">${d.saved?'Draft saved '+d.saved:''}</div>`}
function rin(id,v){S.drafts.recv.v[id]=v;save();const i=S.items.find(x=>x.id===id),el=$('r'+id);if(i&&el)el.textContent=v===''?'–':i.qty+num(v)}
function saveRecv(){S.drafts.recv.saved=nowD()+' '+nowT();save();$('rs').textContent='Draft saved '+S.drafts.recv.saved;toast('Draft saved')}
function completeRecv(){const d=S.drafts.recv;
 if(S.items.some(i=>num(d.v[i.id])<0)){toast('Quantities cannot be negative',1);return}
 const ids=S.items.filter(i=>num(d.v[i.id])>0);if(!ids.length){toast('Enter at least one received quantity first',1);return}
 ask('Add '+ids.length+' item'+(ids.length>1?'s':'')+' to stock?','This updates stock and History straight away.',()=>{
  const dd=nowD(),tm=nowT(),note=[d.sup,d.ref].filter(Boolean).join(' · '),ty=d.type==='Opening balance'?'Opening balance':'Stock received';
  ids.forEach(i=>{const v=num(d.v[i.id]),b=i.qty;i.qty=b+v;S.log.push({t:dd+' '+tm,d:dd,tm,type:ty,user:U.n,cat:i.cat,item:i.name,before:b,after:i.qty,delta:v,note})});
  delete S.drafts.recv;hf='All';save();tab='log';draw();toast(ty+' saved')},'Add to stock')}

function short(){const L=S.items.filter(i=>i.qty<i.par),ls=S.lastShort;
 return `<h3>Short list</h3>${shiftPicker()}<p class="mu">Everything below par, and how much to order.</p>${S.items.length&&S.items.every(i=>!i.par)?'<p class="low">Par levels are not set yet. Admin: set them under Stock > Edit to see what to reorder.</p>':''}
 <div class="tw"><table><tr><th>Item</th><th>Category</th><th>On hand</th><th>Par</th><th>Order</th></tr>
 ${L.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.cat}</td><td class="${low(i)?'low':''}">${i.qty} ${i.unit}</td><td>${i.par}</td><td><b>${i.par-i.qty} ${i.unit}</b></td></tr>`).join('')||'<tr><td colspan="5" class="mu">Nothing is short.</td></tr>'}</table></div>
 <h3 style="margin-top:20px">Short in last stock take</h3>
 ${ls?`<p class="mu">${ls.type} · ${ls.d||ls.t} ${ls.tm||''} · Counted by ${esc(ls.p1||'')} and ${esc(ls.p2||'')}</p><div class="tw"><table><tr><th>Item</th><th>System</th><th>Counted</th><th>Short by</th></tr>
 ${ls.rows.map(r=>`<tr><td>${esc(r.item)}</td><td>${r.system}</td><td>${r.counted}</td><td class="neg">${r.short} ${r.unit}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">Nothing was short.</td></tr>'}</table></div>`:'<p class="mu">No stock take completed yet.</p>'}
 <div class="bar"><button class="b o" onclick="exportShort()">Download short list</button><button class="b o" onclick="print()">Print</button></div>`}

function stock(){return `<h3>Stock</h3><div class="bar">${U.admin?'<button class="b" onclick="itemForm()">Add product</button>':''}<button class="b o" onclick="exportStock()">Download stock sheet</button><input type="text" placeholder="Search products" oninput="filt(this.value)" style="flex:1;min-width:140px"></div>
 <div class="tw"><table><tr><th>Item</th><th>Category</th><th>On hand</th><th>Par</th><th>Status</th>${U.admin?'<th></th>':''}</tr>
 ${S.items.map(i=>`<tr data-n="${nk(i)}"><td>${esc(i.name)}</td><td>${esc(i.cat)}</td><td>${i.qty} ${esc(i.unit)}</td><td>${i.par}</td><td class="${low(i)?'low':'ok'}">${low(i)?'Low':'OK'}</td>
 ${U.admin?`<td style="white-space:nowrap"><button class="b o s" onclick="itemForm(${i.id})">Edit</button> <button class="b d s" onclick="delItem(${i.id})">Remove</button></td>`:''}</tr>`).join('')||`<tr><td colspan="6" class="mu">No products yet.${U.admin?' Tap Add product.':''}</td></tr>`}</table></div>`}
function itemForm(id){const i=id?S.items.find(x=>x.id===id):null;
 form(i?'Edit product':'Add product',[{k:'name',label:'Product name',val:i?i.name:''},{k:'cat',label:'Category',val:i?i.cat:'',list:'cats'},{k:'unit',label:'Unit (optional)',val:i?i.unit:''},
 {k:'par',label:'Par level (full stock)',type:'number',val:i?i.par:''},{k:'qty',label:i?'On hand (a change is logged in History)':'Opening quantity',type:'number',val:i?i.qty:0}],v=>{
  if(!v.name){toast('Enter a product name',1);return false}
  if(S.items.some(x=>x.id!==id&&x.name.toLowerCase()===v.name.toLowerCase()&&String(x.cat).toLowerCase()===String(v.cat||'Other').toLowerCase())){toast('That product already exists in this category',1);return false}
  if(v.par===''||num(v.par)<0||num(v.qty)<0){toast('Par and quantity must be 0 or more',1);return false}
  const dd=nowD(),tm=nowT(),q=num(v.qty);
  if(i){const b=i.qty;Object.assign(i,{name:v.name,cat:v.cat||'Other',unit:v.unit,par:num(v.par),qty:q});
   if(q!==b)S.log.push({t:dd+' '+tm,d:dd,tm,type:'Adjustment',user:U.n,cat:i.cat,item:i.name,before:b,after:q,delta:q-b,note:'Edited by admin'})}
  else{const n={id:S.nid++,name:v.name,cat:v.cat||'Other',unit:v.unit,par:num(v.par),qty:q};{const at=S.items.map(x=>x.cat).lastIndexOf(n.cat);if(at>=0)S.items.splice(at+1,0,n);else S.items.push(n)}
   if(q>0)S.log.push({t:dd+' '+tm,d:dd,tm,type:'Opening balance',user:U.n,cat:n.cat,item:n.name,before:0,after:q,delta:q,note:'Added by admin'})}
  save();draw();toast(i?'Product updated':'Product added')},i?'Save changes':'Add product')}
function delItem(id){const i=S.items.find(x=>x.id===id);if(!i)return;
 ask('Remove '+i.name+'?','It is removed from stock, counts and sheets. Past History entries stay.',()=>{
  S.items=S.items.filter(x=>x.id!==id);Object.values(S.drafts).forEach(d=>{if(d&&d.v)delete d.v[id]});save();draw();toast('Product removed')},'Remove')}

const DFULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const tmin=t=>{const p=String(t).split(':');return (+p[0])*60+(+p[1]||0)};
const span=(s,e)=>{const a=tmin(s);let b=tmin(e);if(b<=a)b+=1440;return[a,b]};
const ovl=(a,b)=>a[0]<b[1]&&b[0]<a[1];
const hrsOf=(s,e)=>{const x=span(s,e);return (x[1]-x[0])/60};
const fh=h=>(Math.round(h*10)/10)+' hrs';
const tdIdx=()=>(new Date().getDay()+6)%7;
const when=x=>x.o===0?'Today':x.o===1?'Tomorrow':DFULL[x.k];
let ssl=0,vas='',si=0,sdi=0;
const who=()=>U.me||vas||'';
function myShifts(me){const out=[],m=me.toLowerCase();
 S.sched.stores.forEach(st=>DAYS.forEach((d,k)=>st.days[d].forEach(x=>{if(x.p.toLowerCase()!==m)return;
  const w=st.days[d].filter(y=>y!==x&&y.p.toLowerCase()!==m&&ovl(span(x.s,x.e),span(y.s,y.e))).map(y=>y.p);
  out.push({k,store:st.name,s:x.s,e:x.e,h:hrsOf(x.s,x.e),with:w})})));
 return out.sort((a,b)=>a.k-b.k||tmin(a.s)-tmin(b.s))}
function nextShift(me){const L=myShifts(me);if(!L.length)return null;const td=tdIdx(),n=new Date(),now=n.getHours()*60+n.getMinutes();
 for(let o=0;o<7;o++){const k=(td+o)%7,c=L.filter(x=>x.k===k&&(o>0||span(x.s,x.e)[1]>now));if(c.length)return Object.assign({o},c[0])}return null}

function home(){const dd=nowD(),ss=sessions().filter(x=>x.d===dd),n=['Opening count','Closing count'].filter(t=>ss.some(x=>x.type===t)).length,nx=U.me?nextShift(U.me):null;
 return `<h3>Hi ${esc(U.n)}</h3><div class="big">
 <button onclick="ssl=${U.admin?1:0};tab='shifts';draw()"><b>Shifts</b><span>${nx?'Next: '+when(nx)+' · '+nx.s+' · '+esc(nx.store):'Weekly rota and who works with who'}</span></button>
 <button onclick="tab='dash';draw()"><b>Stock &amp; counts</b><span class="${n?'ok':'low'}">Today: ${n} of 2 counts done</span></button>
 ${U.admin?'<button onclick="tab=\'admin\';draw()"><b>Admin</b><span>Staff, codes, schedule, products, backup</span></button>':''}</div>`}

function todayCard(){const dd=nowD(),ss=sessions().filter(x=>x.d===dd);
 const row=t=>{const x=ss.filter(y=>y.type===t).pop();return x?`<div class="ok">${t}: done at ${esc(x.tm)} by ${esc(x.p1||'')} and ${esc(x.p2||'')}</div>`:`<div class="low">${t}: not done yet</div>`};
 return `<div class="card" style="margin:12px 0"><div style="font-weight:700;margin-bottom:4px">Today's stock take</div>${row('Opening count')}${row('Closing count')}</div>`}

function shifts(){const me=who(),tabs=['My week','Everyone','Profile'];
 return `${U.admin?`<div class="bar"><select onchange="vas=this.value;draw()"><option value="">View a person…</option>${S.staff.map(x=>`<option ${x.name===vas?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <button class="b o s" onclick="tab='sched';draw()">Edit schedule</button><button class="b o s" onclick="exportRota()">Download rota</button></div>`:''}
 <div class="seg sl">${tabs.map((t,i)=>`<button class="${ssl===i?'on':''}" onclick="goSlide(${i})">${t}</button>`).join('')}</div>
 <p class="mu" style="margin:0 0 8px">Swipe sideways to see everyone's shifts this week.</p>
 <div class="slides" id="sl" onscroll="slScroll(this)"><section>${myWeek(me)}</section><section>${everyone()}</section><section>${profile(me)}</section></div>`}
function slideTo(){const sl=$('sl');if(!sl)return;try{sl.scrollTo({left:sl.clientWidth*ssl,behavior:'auto'})}catch(e){sl.scrollLeft=sl.clientWidth*ssl}}
function seg(){document.querySelectorAll('.seg.sl button').forEach((b,k)=>b.classList.toggle('on',k===ssl))}
function goSlide(i){ssl=i;const sl=$('sl');try{sl.scrollTo({left:sl.clientWidth*i,behavior:'smooth'})}catch(e){sl.scrollLeft=sl.clientWidth*i}seg()}
function slScroll(el){const i=Math.round(el.scrollLeft/(el.clientWidth||1));if(i!==ssl&&i>=0&&i<3){ssl=i;seg()}}

function myWeek(me){if(!me)return '<p class="mu">Choose a person above to see their week.</p>';
 const td=tdIdx(),L=myShifts(me);
 return DAYS.map((d,k)=>{const l=L.filter(x=>x.k===k),t=k===td;
  if(!l.length)return `<div class="day off ${t?'today':''}"><div class="dh">${DFULL[k]}${t?'<em>Today</em>':''}</div><div class="mu">Off</div></div>`;
  return `<div class="day ${t?'today':''}"><div class="dh">${DFULL[k]}${t?'<em>Today</em>':''}</div>${l.map(x=>`<div class="sh"><div class="t">${x.s} – ${x.e}<span>${fh(x.h)}</span></div><div class="st">${esc(x.store)}</div>
  <div class="wm">${x.with.length?'Working with: <b>'+x.with.map(esc).join(', ')+'</b>':'No one else on this shift'}</div></div>`).join('')}</div>`}).join('')}

function everyone(){const me=who().toLowerCase();
 const stores=S.sched.stores.map(st=>{const names=[];DAYS.forEach(d=>st.days[d].forEach(x=>{if(!names.some(n=>n.toLowerCase()===x.p.toLowerCase()))names.push(x.p)}));
  return `<div class="store"><h4>${esc(st.name)}</h4><div class="tw"><table class="grid"><tr><th>Name</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr>
  ${names.map(n=>`<tr class="${n.toLowerCase()===me?'me':''}"><td>${esc(n)}</td>${DAYS.map(d=>{const l=st.days[d].filter(x=>x.p.toLowerCase()===n.toLowerCase());return `<td>${l.map(x=>x.s+'–'+x.e).join('<br>')||'<span class="mu">–</span>'}</td>`}).join('')}</tr>`).join('')||'<tr><td colspan="8" class="mu">No shifts yet.</td></tr>'}</table></div></div>`}).join('');
 const off=DAYS.map((d,k)=>{const w=new Set();S.sched.stores.forEach(st=>st.days[d].forEach(x=>w.add(x.p.toLowerCase())));return [DFULL[k],S.staff.filter(s=>!w.has(s.name.toLowerCase())).map(s=>s.name)]});
 return stores+`<div class="store"><h4>Off each day</h4><div class="tw"><table class="grid">${off.map(o=>`<tr><td>${o[0]}</td><td style="white-space:normal">${o[1].map(esc).join(', ')||'<span class="mu">Everyone is working</span>'}</td></tr>`).join('')}</table></div></div>`}

function profile(me){if(!me)return '<p class="mu">Choose a person above to see their profile.</p>';
 const L=myShifts(me),hrs=L.reduce((t,x)=>t+x.h,0),days=new Set(L.map(x=>x.k)).size,stores=[...new Set(L.map(x=>x.store))],tally={};
 L.forEach(x=>x.with.forEach(n=>tally[n]=(tally[n]||0)+1));
 const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,3),nx=nextShift(me),st=S.staff.find(x=>x.name.toLowerCase()===me.toLowerCase());
 return `<div class="card" style="text-align:center"><div class="av">${esc(me.charAt(0).toUpperCase())}</div><div style="font:700 22px Fraunces,serif;color:var(--gd)">${esc(me)}</div><div class="mu">${stores.map(esc).join(' · ')||'No shifts yet'}</div></div>
 <div class="cards" style="margin:12px 0"><div class="card"><b>${L.length}</b><span class="mu">Shifts this week</span></div><div class="card"><b>${Math.round(hrs*10)/10}</b><span class="mu">Hours</span></div><div class="card"><b>${7-days}</b><span class="mu">Days off</span></div></div>
 <div class="card" style="margin-bottom:10px"><div class="mu">Next shift</div><div style="font-weight:700">${nx?when(nx)+' · '+nx.s+' – '+nx.e+' · '+esc(nx.store):'No shifts scheduled'}</div></div>
 <div class="card" style="margin-bottom:10px"><div class="mu">Works most with</div><div style="font-weight:700">${top.length?top.map(t=>esc(t[0])+' ('+t[1]+')').join(', '):'–'}</div></div>
 ${U.me&&st?`<div class="card"><div class="mu">Your code</div><div style="font:700 24px Fraunces,serif;letter-spacing:4px">${esc(st.code)}</div></div>`:''}`}

function sched(){const stores=S.sched.stores;if(si>=stores.length)si=0;const st=stores[si];
 return `<div class="bar"><button class="b o s" onclick="tab='shifts';draw()">Back to shifts</button></div><h3>Edit schedule</h3>
 <div class="seg">${stores.map((x,i)=>`<button class="${i===si?'on':''}" onclick="si=${i};draw()">${esc(x.name)}</button>`).join('')}<button onclick="storeForm()">+ Add store</button></div>
 ${st?`<div class="seg">${DAYS.map((d,k)=>`<button class="${k===sdi?'on':''}" onclick="sdi=${k};draw()">${d}</button>`).join('')}</div>
 <h3 style="font-size:18px;margin-bottom:8px">${esc(st.name)} · ${DFULL[sdi]}</h3>
 <div class="tw"><table><tr><th>Person</th><th>Time</th><th>Hours</th><th></th></tr>
 ${st.days[DAYS[sdi]].map((x,j)=>`<tr><td>${esc(x.p)}</td><td>${x.s} – ${x.e}</td><td>${fh(hrsOf(x.s,x.e))}</td><td style="white-space:nowrap"><button class="b o s" onclick="shiftForm(${j})">Edit</button> <button class="b d s" onclick="delShift(${j})">Remove</button></td></tr>`).join('')||'<tr><td colspan="4" class="mu">No shifts this day.</td></tr>'}</table></div>
 <div class="bar"><button class="b" onclick="shiftForm()">Add shift</button><button class="b o" onclick="storeForm(${si})">Rename store</button><button class="b d" onclick="delStore()">Remove store</button></div>`:'<p class="mu">No stores yet.</p><div class="bar"><button class="b" onclick="storeForm()">Add store</button></div>'}`}
function clash(p,k,s,e,skip){const a=span(s,e),d=DAYS[k];for(const st of S.sched.stores)for(const x of st.days[d]){if(x===skip||x.p.toLowerCase()!==p.toLowerCase())continue;if(ovl(a,span(x.s,x.e)))return 'at '+st.name+' '+x.s+'–'+x.e}return null}
function shiftForm(j){const st=S.sched.stores[si],arr=st.days[DAYS[sdi]],x=j==null?null:arr[j];
 form(x?'Edit shift':'Add shift · '+DFULL[sdi],[{k:'p',label:'Person',val:x?x.p:'',list:'rost'},{k:'s',label:'Start',type:'time',val:x?x.s:'09:30'},{k:'e',label:'End',type:'time',val:x?x.e:'16:30'}],v=>{
  const per=S.staff.find(y=>y.name.toLowerCase()===v.p.toLowerCase());
  if(!per){toast('Add them under Admin > Staff first',1);return false}
  if(!/^\d\d:\d\d$/.test(v.s)||!/^\d\d:\d\d$/.test(v.e)||v.s===v.e){toast('Enter a valid start and end time',1);return false}
  const c=clash(per.name,sdi,v.s,v.e,x);if(c){toast(per.name+' is already working '+c,1);return false}
  const o={p:per.name,s:v.s,e:v.e};if(x)Object.assign(x,o);else arr.push(o);
  arr.sort((a,b)=>tmin(a.s)-tmin(b.s));save();draw();toast('Shift saved')},x?'Save':'Add shift')}
function delShift(j){const arr=S.sched.stores[si].days[DAYS[sdi]],x=arr[j];if(!x)return;ask('Remove '+x.p+"'s shift?",x.s+' – '+x.e+' on '+DFULL[sdi]+'.',()=>{arr.splice(j,1);save();draw();toast('Shift removed')},'Remove')}
function storeForm(k){const s=k==null?null:S.sched.stores[k];
 form(s?'Rename store':'Add store',[{k:'name',label:'Store name',val:s?s.name:''}],v=>{
  if(!v.name){toast('Enter a store name',1);return false}
  if(S.sched.stores.some((x,j)=>j!==k&&x.name.toLowerCase()===v.name.toLowerCase())){toast('That store already exists',1);return false}
  if(s)s.name=v.name;else{S.sched.stores.push({id:Date.now(),name:v.name,days:Object.fromEntries(DAYS.map(d=>[d,[]]))});si=S.sched.stores.length-1}
  save();draw();toast('Saved')},s?'Save':'Add store')}
function delStore(){const st=S.sched.stores[si];if(!st)return;ask('Remove '+st.name+'?','All of its shifts are removed. Stock and history are not affected.',()=>{S.sched.stores.splice(si,1);si=0;save();draw();toast('Store removed')},'Remove')}

function staffForm(k){const s=k==null?null:S.staff[k];
 form(s?'Edit staff member':'Add staff member',[{k:'name',label:'Name',val:s?s.name:''},{k:'code',label:'Code (4 to 6 digits)',val:s?s.code:newCode(S)}],v=>{
  if(!v.name){toast('Enter a name',1);return false}
  if(S.staff.some((x,j)=>j!==k&&x.name.toLowerCase()===v.name.toLowerCase())){toast('That name already exists',1);return false}
  if(!/^\d{4,6}$/.test(v.code)){toast('Code must be 4 to 6 digits',1);return false}
  if(v.code===S.pins.admin||S.staff.some((x,j)=>j!==k&&x.code===v.code)){toast('That code is already in use',1);return false}
  if(s){const old=s.name;s.name=v.name;s.code=v.code;if(old!==v.name)S.sched.stores.forEach(st=>DAYS.forEach(d=>st.days[d].forEach(x=>{if(x.p===old)x.p=v.name})))}
  else S.staff.push({name:v.name,code:v.code,days:Array(7).fill(false)});
  save();draw();toast('Saved')},s?'Save':'Add')}
function delStaff(k){const s=S.staff[k];if(!s)return;ask('Remove '+s.name+'?','They are removed from the staff list and the schedule. Past history keeps their name.',()=>{
 S.sched.stores.forEach(st=>DAYS.forEach(d=>{st.days[d]=st.days[d].filter(x=>x.p.toLowerCase()!==s.name.toLowerCase())}));S.staff.splice(k,1);save();draw();toast('Staff member removed')},'Remove')}
function shareCode(k){const s=S.staff[k],t='Hi '+s.name+', your Kush Collective portal code is '+s.code+'. Open '+location.href.split('#')[0]+' and enter it to see your shifts.';
 if(navigator.share){navigator.share({text:t}).catch(()=>{})}else{try{navigator.clipboard.writeText(t).then(()=>toast('Message copied'),()=>toast(t))}catch(e){toast(t)}}}
function exportRota(){const wb=XLSX.utils.book_new();
 S.sched.stores.forEach(st=>{const names=[];DAYS.forEach(d=>st.days[d].forEach(x=>{if(!names.includes(x.p))names.push(x.p)}));
  const rows=names.map(n=>[n,...DAYS.map(d=>st.days[d].filter(x=>x.p===n).map(x=>x.s+'–'+x.e).join(' / ')),Number(DAYS.reduce((t,d)=>t+st.days[d].filter(x=>x.p===n).reduce((q,x)=>q+hrsOf(x.s,x.e),0),0).toFixed(1))]);
  XLSX.utils.book_append_sheet(wb,mk('Kush Collective – '+st.name+' rota',[['Exported',nowD()]],['Name',...DAYS,'Hours'],rows,[16,...DAYS.map(()=>15),9]),st.name.replace(/[:\\\/?*\[\]]/g,' ').slice(0,31))});
 save_(wb,'Kush-Rota')}

function hist(){const F=S.log.filter(l=>hf==='All'||l.type===hf);return `<h3>History</h3><div class="bar"><select onchange="hf=this.value;draw()">${['All','Stock received','Opening balance','Opening count','Closing count','Adjustment'].map(t=>`<option ${t===hf?'selected':''}>${t}</option>`).join('')}</select><button class="b o" onclick="exportHistory()">Download history</button></div>
 <div class="tw"><table><tr><th>Date</th><th>Time</th><th>Type</th><th>Counted by</th><th>Item</th><th>Before</th><th>After</th><th>Change</th><th>Note</th></tr>
 ${F.slice().reverse().slice(0,300).map(l=>`<tr><td>${l.d||l.t}</td><td>${l.tm||''}</td><td>${l.type}</td><td>${l.p1?esc(l.p1)+' &amp; '+esc(l.p2):''}</td><td>${esc(l.item)}${l.cat?'<div class="mu">'+esc(l.cat)+'</div>':''}</td><td>${l.before}</td><td>${l.after}</td><td class="${l.delta<0?'neg':l.delta>0?'pos':''}">${l.delta>0?'+':''}${l.delta}</td><td>${esc(l.note||'')}</td></tr>`).join('')||'<tr><td colspan="10" class="mu">No counts yet.</td></tr>'}</table></div>`}

function admin(){return `<h3>Admin</h3>
 <h3 style="margin-top:18px;font-size:17px">Staff and codes</h3><p class="mu">Each person's code opens their own shifts automatically. Tap Share to send it.</p>
 <div class="tw"><table><tr><th>Name</th><th>Code</th><th></th></tr>${S.staff.map((s,k)=>`<tr><td>${esc(s.name)}</td><td><span style="font-weight:700;font-size:16px;letter-spacing:2px">${esc(s.code)}</span></td><td style="text-align:right;white-space:nowrap"><button class="b s" onclick="shareCode(${k})">Share</button> <button class="b o s" onclick="staffForm(${k})">Edit</button> <button class="b d s" onclick="delStaff(${k})">Remove</button></td></tr>`).join('')||'<tr><td colspan="3" class="mu">No staff added yet.</td></tr>'}</table></div>
 <div class="bar"><button class="b" onclick="staffForm()">Add staff member</button><button class="b o" onclick="tab='sched';draw()">Edit schedule</button><button class="b o" onclick="exportRota()">Download rota</button></div>
 <h3 style="margin-top:18px;font-size:17px">Products</h3><div class="bar"><button class="b" onclick="itemForm()">Add product</button><button class="b o" onclick="tab='stock';draw()">Edit or remove products</button></div>
 <h3 style="margin-top:18px;font-size:17px">Admin PIN</h3>
 <div class="bar"><input type="text" id="pa" value="${esc(S.pins.admin)}" maxlength="6" style="width:120px"><button class="b" onclick="savePins()">Save PIN</button></div>
 <h3 style="margin-top:18px;font-size:17px">Backup</h3><p class="mu">Download a backup regularly. Restore it on any device.</p>
 <div class="bar"><button class="b" onclick="backup()">Download backup</button><button class="b o" onclick="exportXlsx()">Download full records (Excel)</button><label class="b o">Restore backup<input type="file" accept=".json" class="hide" onchange="restore(this.files[0])"></label></div>
 <h3 style="margin-top:18px;font-size:17px">Recover data</h3><p class="mu">The portal keeps automatic daily snapshots on this device.</p>
 <div class="tw"><table>${snapList().map(x=>`<tr><td>${esc(x.label)}</td><td style="text-align:right"><button class="b o s" onclick="restoreSnap('${x.k}')">Restore</button></td></tr>`).join('')||'<tr><td class="mu">No snapshots yet.</td></tr>'}</table></div>
 <h3 style="margin-top:18px;font-size:17px">Danger zone</h3>
 <div class="bar"><button class="b d" onclick="ask('Clear all history?','This cannot be undone. Stock levels stay as they are.',()=>{S.log=[];S.lastShort=null;S.lastCount=null;save();draw();toast('History cleared')},'Clear history')">Clear history</button>
 <button class="b d" onclick="ask('Reset everything?','All products, stock, staff, schedule, history and PINs go back to defaults.',()=>{S=seed();save();draw();toast('Reset to defaults')},'Reset all')">Reset all data</button></div>`}
function savePins(){const a=$('pa').value.trim();if(a.length<4){toast('PIN needs 4+ characters',1);return}if(S.staff.some(x=>x.code===a)){toast('That PIN matches a staff code',1);return}S.pins.admin=a;save();toast('PIN saved')}

const nowD=()=>new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),nowT=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const BD={top:{style:'thin',color:{rgb:'BFD3C6'}},bottom:{style:'thin',color:{rgb:'BFD3C6'}},left:{style:'thin',color:{rgb:'BFD3C6'}},right:{style:'thin',color:{rgb:'BFD3C6'}}};
const ST={title:{font:{bold:true,sz:20,color:{rgb:'14532D'}},alignment:{vertical:'center'}},mb:{font:{bold:true,sz:13}},m:{font:{sz:13}},
 band:{font:{bold:true,sz:13,color:{rgb:'14532D'}},fill:{patternType:'solid',fgColor:{rgb:'D5EBDC'}},alignment:{vertical:'center'},border:BD},
 num:{font:{bold:true,sz:14},alignment:{horizontal:'center',vertical:'center'},border:BD},
 th:{font:{bold:true,sz:13,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'1F7A4D'}},alignment:{vertical:'center',wrapText:true},border:BD},
 td:{font:{sz:13},alignment:{vertical:'center',wrapText:true},border:BD},tdz:{font:{sz:13},fill:{patternType:'solid',fgColor:{rgb:'F3F9F5'}},alignment:{vertical:'center',wrapText:true},border:BD},
 bad:{font:{sz:13,bold:true,color:{rgb:'C0392B'}},fill:{patternType:'solid',fgColor:{rgb:'FDECEA'}},alignment:{vertical:'center',wrapText:true},border:BD}};
function mk(title,meta,head,rows,w,flag){
 const A=[[title],...meta,[],head,...rows.map(r=>r.band?[r.band]:r)],hr=meta.length+2,nc=head.length,ws=XLSX.utils.aoa_to_sheet(A);
 ws['!cols']=w.map(x=>({wch:x}));ws['!rows']=A.map((_,r)=>({hpt:r===0?34:r===hr?30:24}));
 ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:nc-1}}];
 const set=(r,c,st)=>{const a=XLSX.utils.encode_cell({r,c});if(!ws[a])ws[a]={t:'s',v:''};ws[a].s=st};
 set(0,0,ST.title);meta.forEach((_,i)=>{set(i+1,0,ST.mb);set(i+1,1,ST.m)});
 head.forEach((_,c)=>set(hr,c,ST.th));let k=0;
 rows.forEach((r,i)=>{const R=hr+1+i;
  if(r.band){for(let c=0;c<nc;c++)set(R,c,ST.band);ws['!merges'].push({s:{r:R,c:0},e:{r:R,c:nc-1}});return}
  const bad=flag&&flag(r),z=k++%2;head.forEach((_,c)=>set(R,c,bad?ST.bad:typeof r[c]==='number'?ST.num:(z?ST.tdz:ST.td)))});
 return ws}
const head3=()=>[['Date',nowD()],['Time',nowT()]];
const nm=(a,b)=>[['Counted by',(a||'')+(b?' and '+b:'')]];
function takeSheet(type,d,tm,p1,p2,note,rows){
 const body=[];let last=null;
 rows.forEach(r=>{if(r.cat&&r.cat!==last){body.push({band:r.cat});last=r.cat}body.push([r.item,r.counted===''||r.counted==null?'':r.counted])});
 const meta=[['Date',d],['Time',tm||''],['Counted by',p1?p1+(p2?' and '+p2:''):'Not recorded']];if(note)meta.push(['Note',note]);
 return mk('Kush Collective – '+type,meta,['Item','Count'],body,[44,14])}
function save_(wb,name){XLSX.writeFile(wb,name+'-'+new Date().toISOString().slice(0,10)+'.xlsx')}
function exportCount(){const d=dk(),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,takeSheet(mode,nowD(),nowT(),(d.p1||'').trim(),(d.p2||'').trim(),d.note,S.items.map(i=>({item:i.name,cat:i.cat,unit:i.unit,par:i.par,system:i.qty,counted:d.v[i.id]===undefined||d.v[i.id]===''?'':num(d.v[i.id])}))),'Stock take');
 save_(wb,'Kush-'+mode.replace(/ /g,'-'))}
const ex=()=>[['Exported',nowD()+' '+nowT()]];
const wsStock=()=>mk('Kush Collective – Stock',ex(),['Item','Category','Unit','On hand','Par','Status','Order qty'],S.items.map(i=>[i.name,i.cat,i.unit,i.qty,i.par,low(i)?'LOW':i.qty<i.par?'Below par':'OK',Math.max(0,i.par-i.qty)]),[34,16,9,11,9,13,11],r=>r[5]==='LOW');
const wsShort=()=>mk('Kush Collective – Short list',ex(),['Item','Category','Unit','On hand','Par','Order qty'],S.items.filter(i=>i.qty<i.par).map(i=>[i.name,i.cat,i.unit,i.qty,i.par,i.par-i.qty]),[34,16,9,11,9,11]);
const wsHist=()=>mk('Kush Collective – History',ex(),['Date','Time','Type','Counted by','Item','Before','After','Change','Note','Entered by'],
 S.log.slice().reverse().map(l=>[l.d||l.t,l.tm||'',l.type,l.p1?l.p1+' and '+l.p2:'',l.item+(l.cat?' ('+l.cat+')':''),l.before,l.after,l.delta,l.note||'',l.user]),[14,9,18,26,30,9,9,9,26,12],r=>/count/.test(r[2])&&r[7]<0);
const wsShifts=()=>mk('Kush Collective – Shifts',ex(),['Name',...DAYS],S.staff.map(s=>[s.name,...s.days.map(x=>x?'Yes':'')]),[22,8,8,8,8,8,8,8]);
function dl(name,parts){const wb=XLSX.utils.book_new();parts.forEach(p=>XLSX.utils.book_append_sheet(wb,p[1](),p[0]));save_(wb,name)}
const exportStock=()=>dl('Kush-Stock',[['Stock',wsStock]]);
const exportShort=()=>dl('Kush-Short-list',[['Short list',wsShort]]);
const exportHistory=()=>dl('Kush-History',[['History',wsHist]]);
const exportXlsx=()=>dl('Kush-Full-records',[['Stock',wsStock],['Short list',wsShort],['History',wsHist],['Shifts',wsShifts]]);

function sessions(){const out=[];let cur=null;
 S.log.forEach(l=>{if(l.type!=='Opening count'&&l.type!=='Closing count'){cur=null;return}
  const k=[l.d||l.t,l.tm||'',l.type,l.p1||'',l.p2||''].join('|');
  if(!cur||cur.k!==k){cur={k,d:l.d||l.t,tm:l.tm||'',type:l.type,p1:l.p1||'',p2:l.p2||'',note:l.note||'',rows:[]};out.push(cur)}
  const it=S.items.find(i=>l.iid!=null?i.id===l.iid:i.name===l.item);cur.rows.push({item:l.item,cat:l.cat||(it?it.cat:''),system:l.before,counted:l.after})});
 return out}
const dayList=()=>[...new Set(sessions().map(x=>x.d))];
function shiftPicker(){const ss=sessions();
 if(!ss.length)return '<div class="card" style="margin:14px 0"><div style="font-weight:700">Download a count</div><div class="mu">Complete a stock take to download its counts.</div></div>';
 const days=dayList();
 return `<div class="card" style="margin:14px 0"><div style="font-weight:700;margin-bottom:4px">Download a count</div>
 <div class="mu" style="margin-bottom:8px">Just the item counts. Nothing else is included.</div>
 <div class="bar" style="margin:0"><select id="shsel" style="flex:1;min-width:200px">${ss.map((x,i)=>`<option value="s${i}">${esc(x.d)} · ${esc(x.tm)} · ${esc(x.type)}${x.p1?' · '+esc(x.p1)+' &amp; '+esc(x.p2):''}</option>`).reverse().join('')}
 ${days.map((d,i)=>`<option value="d${i}">All counts on ${esc(d)}</option>`).reverse().join('')}</select>
 <button class="b" onclick="downloadShift()">Download</button></div></div>`}
function shiftBook(list,name){const wb=XLSX.utils.book_new(),used={};
 list.forEach(se=>{const n=(se.type+' '+se.tm).replace(/[:\\\/?*\[\]]/g,'.').trim().slice(0,28);let k=n,c=2;while(used[k])k=n+' '+c++;used[k]=1;
  XLSX.utils.book_append_sheet(wb,takeSheet(se.type,se.d,se.tm,se.p1,se.p2,se.note,se.rows),k)});
 XLSX.writeFile(wb,name.replace(/[^\w-]+/g,'-')+'.xlsx')}
function downloadShift(){const v=$('shsel').value,ss=sessions();
 if(v[0]==='s'){const se=ss[+v.slice(1)];if(se)shiftBook([se],'Kush-'+se.type+'-'+se.d+'-'+se.tm)}
 else{const d=dayList()[+v.slice(1)];shiftBook(ss.filter(x=>x.d===d),'Kush-Counts-'+d)}}
setInterval(tickClk,10000);
if(locked)showLock();
addEventListener('storage',e=>{if(e.key!=='kush_v2'||!e.newValue||!U)return;try{const d=migrate(JSON.parse(e.newValue));if(!d)return;S=d}catch(x){return}
 const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)||$('dlg').open)return;draw()});
try{const u=sessionStorage.getItem('kushU');if(u){U=JSON.parse(u);tab=U.admin?'home':'shifts';ssl=U.admin?1:0;$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=U.n;draw()}}catch(e){}
</script></body></html>
