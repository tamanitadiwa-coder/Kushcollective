<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kush Collective – Staff Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{--g:#1f7a4d;--gd:#14532d;--gl:#e8f4ec;--bg:#fff;--bg2:#f6faf7;--tx:#16241c;--mu:#667a6e;--bd:#dbe7de;--rd:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;color:var(--gd)}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font:700 22px Fraunces,serif}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:linear-gradient(#fff,var(--gl))}
#login .logo{width:110px;height:110px;font-size:52px}
.pin{display:flex;gap:10px}.pin input{width:200px;text-align:center;font-size:26px;letter-spacing:10px;padding:12px;border:1.5px solid var(--bd);border-radius:12px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;z-index:5}
header h2{font-size:18px;flex:1}header small{color:var(--mu)}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;padding:9px 14px;border-radius:999px;font:500 14px 'DM Sans';color:var(--mu);white-space:nowrap;cursor:pointer}
nav button.on{background:var(--g);color:#fff}
main{padding:16px;max-width:980px;margin:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
button.b,select,input,textarea{font:inherit}
.b{background:var(--g);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer}
.b.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}.b.d{background:#fff;color:var(--rd);border:1.5px solid var(--rd)}.b.s{padding:6px 10px;font-size:13px}
select,input[type=text],input[type=number],input[type=password]{border:1.5px solid var(--bd);border-radius:9px;padding:9px 10px;background:#fff;max-width:100%}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--gl);color:var(--gd);text-align:left;padding:10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--bd)}td input[type=number]{width:84px}
.low{color:var(--rd);font-weight:700}.ok{color:var(--g);font-weight:700}.pos{color:var(--g)}.neg{color:var(--rd)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px}.card b{font:700 28px Fraunces,serif;color:var(--gd);display:block}
.mu{color:var(--mu);font-size:13px}.hide{display:none!important}
.chk{width:22px;height:22px;accent-color:var(--g)}
dialog{border:0;border-radius:16px;padding:20px;max-width:420px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,.25);color:var(--tx)}dialog::backdrop{background:rgba(20,40,28,.45)}
dialog label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}dialog input{width:100%}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:12px 18px;border-radius:12px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}#toast.err{background:var(--rd)}.req{border-color:var(--rd)!important;background:#fff5f4}
.stamp{display:inline-flex;align-items:center;background:var(--gl);color:var(--gd);padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px}
@media print{header,nav,.bar,.noprint{display:none!important}}
</style></head><body>

<div id="login">
  <div class="logo" data-logo>K</div>
  <h1>Kush Collective</h1><div class="mu">Staff portal · enter your PIN</div>
  <div id="lockbox" class="card hide" style="max-width:380px;text-align:center;color:var(--rd)"></div>
  <div class="pin"><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
  <button class="b" onclick="login()">Sign in</button><div id="err" class="neg"></div>
</div>

<div id="app" class="hide">
  <header><div class="logo" data-logo>K</div><h2>Kush Collective<br><small id="who"></small></h2>
    <span id="sv" class="mu"></span><button class="b o s" onclick="logout()">Sign out</button></header>
  <nav id="nav"></nav><main id="main"></main>
</div>

<dialog id="dlg"></dialog><div id="toast"></div>
<script>
const LOGO="https://i0.wp.com/kushcannabiscollective.com/wp-content/uploads/2025/11/kush-logo-V2.png?fit=512%2C512&ssl=1";
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DATA_V=3;
const seed=()=>({v:DATA_V,pins:{admin:'1234',staff:'0000'},
 items:[['Flower – House Blend','Flower','g',200,0],['Flower – Premium A','Flower','g',200,0],['Flower – Premium B','Flower','g',150,0],
 ['Pre-rolls','Flower','pcs',40,0],['Rolling papers','Accessories','pcs',30,0],['Filter tips','Accessories','pcs',30,0],['Grinders','Accessories','pcs',10,0],
 ['Lighters','Accessories','pcs',20,0],['Water','Refreshments','pcs',48,0],['Cooldrink','Refreshments','pcs',48,0]].map((r,i)=>({id:i+1,name:r[0],cat:r[1],unit:r[2],par:r[3],qty:r[4]})),
 log:[],staff:[],nid:11,drafts:{},lastShort:null});
let S,U=null,tab='dash',mode='Closing count';
let storeOK=true,hf='All';
function migrate(d){
 if(!d||typeof d!=='object'||!Array.isArray(d.items))return null;
 const n0=v=>isNaN(parseFloat(v))?0:parseFloat(v);
 d.pins=Object.assign({admin:'1234',staff:'0000'},d.pins||{});
 d.log=Array.isArray(d.log)?d.log:[];d.staff=Array.isArray(d.staff)?d.staff:[];
 d.drafts=d.drafts&&typeof d.drafts==='object'?d.drafts:{};d.lastShort=d.lastShort||null;d.lastCount=d.lastCount||null;
 let mx=0;const seen=new Set();
 d.items.forEach(i=>{if(i.id==null||seen.has(i.id))i.id=null;else{seen.add(i.id);mx=Math.max(mx,n0(i.id))}});
 d.items.forEach(i=>{if(i.id==null){i.id=++mx;seen.add(i.id)}i.name=String(i.name==null?'Item':i.name);i.cat=i.cat||'Other';i.unit=i.unit||'pcs';i.par=n0(i.par);i.qty=n0(i.qty)});
 d.nid=Math.max(n0(d.nid),mx+1);
 d.staff.forEach(x=>{x.name=String(x.name==null?'':x.name);if(!Array.isArray(x.days))x.days=[];while(x.days.length<7)x.days.push(false)});
 d.log.forEach(l=>{if(l.type==='Stock intake')l.type='Stock received'});
 d.v=DATA_V;return d}
let locked=false;
function loadS(){let raw=null;
 for(const k of ['kush_v2','kush']){try{const r=localStorage.getItem(k);if(r){raw=r;break}}catch(e){}}
 if(raw===null){try{if(window.name.startsWith('KUSH:'))raw=window.name.slice(5)}catch(e){}}
 if(raw===null)return null;
 try{const o=JSON.parse(raw);
  if((o.v||0)<DATA_V){try{if(!localStorage.getItem('kush_before_update'))localStorage.setItem('kush_before_update',raw)}catch(e){}}
  const d=migrate(o);if(d)return d}catch(e){}
 try{localStorage.setItem('kush_unreadable_copy',raw)}catch(e){}
 locked=true;return null}
S=loadS();
S=S||seed();
function save(){if(locked)return;const j=JSON.stringify(S);let ok=false;
 try{localStorage.setItem('kush_v2',j);ok=localStorage.getItem('kush_v2')===j}catch(e){}
 try{window.name='KUSH:'+j}catch(e){}
 storeOK=ok;if(ok)snap();badge()}
let lastSnap=0;
function snap(){if(Date.now()-lastSnap<60000)return;lastSnap=Date.now();try{const d=new Date().toISOString().slice(0,10);let a=JSON.parse(localStorage.getItem('kush_snaps')||'[]');
 if(a.length&&a[a.length-1].d===d)a[a.length-1].j=JSON.stringify(S);else{a.push({d,j:JSON.stringify(S)});while(a.length>7)a.shift()}
 localStorage.setItem('kush_snaps',JSON.stringify(a))}catch(e){}}
function badge(){const b=$('sv');if(!b)return;b.textContent=storeOK?'Saved '+hm():'Not saving';b.className=storeOK?'ok':'low'}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='Kush-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=migrate(JSON.parse(r.result));if(!d)throw 0}catch(e){toast('That file is not a Kush backup',1);return}
 ask('Restore this backup?','All current data is replaced by the backup.',()=>{S=d;locked=false;save();$('lockbox').classList.add('hide');if(U)draw();toast('Backup restored')},'Restore')};r.readAsText(f)}
function snapList(){let a=[];try{a=JSON.parse(localStorage.getItem('kush_snaps')||'[]')}catch(e){}
 const out=a.map((x,i)=>({k:i,label:'Automatic snapshot · '+x.d,j:x.j}));
 try{const b=localStorage.getItem('kush_before_update');if(b)out.push({k:-1,label:'Copy taken before the last update',j:b})}catch(e){}
 return out.reverse()}
function restoreSnap(k){const x=snapList().find(y=>y.k===k);let d;try{d=migrate(JSON.parse(x.j))}catch(e){}if(!d){toast('That snapshot is unreadable',1);return}
 ask('Restore '+x.label+'?','Current data is replaced. Download a backup first if unsure.',()=>{S=d;locked=false;save();draw();toast('Snapshot restored')},'Restore')}
function showLock(){const b=$('lockbox');b.classList.remove('hide');
 b.innerHTML='<b>Saved data could not be read.</b><div class="mu" style="margin:6px 0">Nothing has been deleted and saving is paused to protect it. Restore a backup file, or start fresh. A copy of the unreadable data is kept on this device.</div><div class="bar" style="justify-content:center"><label class="b o s">Restore backup file<input type="file" accept=".json" class="hide" onchange="restore(this.files[0])"></label><button class="b d s" onclick="startFresh()">Start fresh</button></div>'}
function startFresh(){ask('Start fresh?','This begins with empty defaults. The unreadable copy stays on this device.',()=>{locked=false;S=seed();save();$('lockbox').classList.add('hide');toast('Started fresh')},'Start fresh')}
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>isNaN(parseFloat(v))?0:parseFloat(v);

// logo with fallback to the "K" mark
const im=new Image();im.onload=()=>document.querySelectorAll('[data-logo]').forEach(e=>{e.innerHTML='';const i=im.cloneNode();i.style.cssText='width:100%;height:100%;border-radius:50%;object-fit:cover';e.style.background='none';e.appendChild(i)});im.src=LOGO;

function toast(m,err){const t=$('toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)}
function form(title,fields,onOk,okText){const d=$('dlg');
 d.innerHTML=`<h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.label)}</label><input id="f_${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="any" min="0" inputmode="decimal"':''} ${f.list?'list="'+f.list+'"':''} value="${esc(f.val==null?'':f.val)}">`).join('')}
 <datalist id="cats">${[...new Set(S.items.map(i=>i.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <div class="bar" style="margin-top:18px"><button class="b" id="fok">${esc(okText||'Save')}</button><button class="b o" id="fno">Cancel</button></div>`;
 d.showModal();$('fno').onclick=()=>d.close();
 $('fok').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('f_'+f.k).value.trim());if(onOk(v)!==false)d.close()}}
function ask(title,body,onOk,okText){const d=$('dlg');
 d.innerHTML=`<h3>${esc(title)}</h3><p class="mu" style="font-size:14px">${esc(body||'')}</p><div class="bar" style="margin-top:18px"><button class="b" id="fok">${esc(okText||'Yes')}</button><button class="b o" id="fno">Cancel</button></div>`;
 d.showModal();$('fno').onclick=()=>d.close();$('fok').onclick=()=>{d.close();onOk()}}
function login(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 const p=$('pin').value;
 if(p===S.pins.admin)U={n:'Admin',admin:1};else if(p===S.pins.staff)U={n:'Staff',admin:0};
 else{$('err').textContent='Wrong PIN';return}
 $('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=U.n;$('pin').value='';tab='dash';try{sessionStorage.setItem('kushU',JSON.stringify(U))}catch(e){}draw()}
function logout(){U=null;try{sessionStorage.removeItem('kushU')}catch(e){}$('app').classList.add('hide');$('login').classList.remove('hide');$('err').textContent=''}
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

const TABS=[['dash','Overview'],['recv','Stock received'],['count','Count sheet'],['short','Short list'],['stock','Stock'],['shifts','Shifts'],['log','History'],['admin','Admin']];
function draw(){
 $('nav').innerHTML=TABS.filter(t=>t[0]!=='admin'||U.admin).map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('');
 $('main').innerHTML=(storeOK?'':'<div class="card low" style="margin-bottom:12px">This device or app is blocking saving, so data will be lost when you close the page. Open this file in Chrome or Safari, or use Backup in Admin.</div>')+({dash,count,recv,short,stock,shifts,log:hist,admin})[tab]();
 if(tab==='count')S.items.forEach(i=>calc(i.id));
 badge();tickClk();
}
const low=i=>i.qty<i.par*0.25;

function dash(){const L=S.items.filter(low);
 return `<h3>How it works</h3><div class="cards" style="margin:12px 0 20px">
 <div class="card" onclick="tab='recv';draw()" style="cursor:pointer"><b>1</b>Receive stock<div class="mu">Log every delivery. Use Opening balance for what you already have.</div></div>
 <div class="card" onclick="tab='count';draw()" style="cursor:pointer"><b>2</b>Count at shift<div class="mu">Opening and closing counts. Variances are logged.</div></div>
 <div class="card" onclick="tab='short';draw()" style="cursor:pointer"><b>3</b>Check short list<div class="mu">See what to reorder and what went missing.</div></div></div>
 <h3>Overview</h3><div class="bar"></div><div class="cards">
 <div class="card"><b>${S.items.length}</b><span class="mu">Products</span></div>
 <div class="card"><b>${L.length}</b><span class="mu">Low stock</span></div>
 <div class="card"><b>${S.log.length}</b><span class="mu">Log entries</span></div></div>
 <h3 style="margin-top:20px">Needs reorder</h3>
 ${L.length?`<div class="tw"><table><tr><th>Item</th><th>On hand</th><th>Par</th></tr>${L.map(i=>`<tr><td>${esc(i.name)}</td><td class="low">${i.qty} ${i.unit}</td><td>${i.par}</td></tr>`).join('')}</table></div>`:'<p class="mu">Nothing is running low.</p>'}
 <div class="bar"><button class="b" onclick="tab='recv';draw()">Stock received</button><button class="b o" onclick="tab='count';draw()">Count sheet</button></div>`}

function dk(){return S.drafts[mode]=S.drafts[mode]||{v:{},note:''}}
const hm=()=>new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
function tickClk(){document.querySelectorAll('.clk').forEach(e=>e.textContent=nowD()+'  ·  '+nowT())}
function count(){const d=dk();
 return `<h3>Count sheet</h3>
 <div class="bar"><select onchange="mode=this.value;draw()">${['Opening count','Closing count'].map(m=>`<option ${m===mode?'selected':''}>${m}</option>`).join('')}</select><span class="stamp clk"></span></div>
 <p class="mu">Date and time are added automatically. Type the names of both people doing this stock take.</p>
 <div class="bar"><input id="p1" list="stf" type="text" placeholder="Counted by – person 1" value="${esc(d.p1||'')}" oninput="dk().p1=this.value;this.classList.remove('req');save()">
 <input id="p2" list="stf" type="text" placeholder="Counted by – person 2" value="${esc(d.p2||'')}" oninput="dk().p2=this.value;this.classList.remove('req');save()"></div>
 <datalist id="stf">${S.staff.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
 <div class="tw"><table><tr><th>Item</th><th>System</th><th>Counted</th><th>Variance</th></tr>
 ${S.items.map(i=>`<tr><td>${esc(i.name)}<div class="mu">${esc(i.cat)} · ${esc(i.unit)}</div></td><td>${i.qty}</td>
 <td><input type="number" step="any" min="0" id="c${i.id}" value="${d.v[i.id]??''}" oninput="cin(${i.id},this.value)"></td><td id="v${i.id}">–</td></tr>`).join('')||'<tr><td colspan="4" class="mu">No products yet. An admin can add them under Stock.</td></tr>'}</table></div>
 <div class="bar"><input type="text" id="note" placeholder="Note (optional)" value="${esc(d.note||'')}" oninput="dk().note=this.value;save()" style="flex:1;min-width:160px"></div>
 <div class="bar"><button class="b o" onclick="saveDraft()">Save draft</button><button class="b" onclick="completeCount()">Complete stock take</button>
 <button class="b o" onclick="exportCount()">Download sheet</button><button class="b o" onclick="print()">Print</button></div>
 <div class="mu" id="ds">${d.saved?'Draft saved '+d.saved:''}</div>${shiftPicker()}`}
function cin(id,v){dk().v[id]=v;save();calc(id)}
function calc(id){const i=S.items.find(x=>x.id===id),r=$('c'+id);if(!r||!i)return;const el=$('v'+id);
 if(r.value===''){el.textContent='–';el.className='';return}
 const d=num(r.value)-i.qty;el.textContent=(d>0?'+':'')+d+(d<0?' short':'');el.className=d<0?'neg':d>0?'pos':''}
function names(){const d=dk(),a=(d.p1||'').trim(),b=(d.p2||'').trim();
 if(!a||!b){if(!a)$('p1').classList.add('req');if(!b)$('p2').classList.add('req');toast('Type the names of both people first',1);$(!a?'p1':'p2').focus();return null}
 if(a.toLowerCase()===b.toLowerCase()){$('p2').classList.add('req');toast('Person 1 and person 2 must be different people',1);$('p2').focus();return null}
 return [a,b]}
function saveDraft(){const n=names();if(!n)return;const d=dk();d.saved=nowD()+' '+nowT();save();$('ds').textContent='Draft saved '+d.saved;toast('Draft saved')}
function completeCount(){const n=names();if(!n)return;const d=dk(),has=i=>d.v[i.id]!==undefined&&d.v[i.id]!=='';
 if(S.items.some(i=>has(i)&&num(d.v[i.id])<0)){toast('Counts cannot be negative',1);return}
 const ids=S.items.filter(has);if(!ids.length){toast('Enter at least one count first',1);return}
 const miss=S.items.length-ids.length;
 ask('Complete this '+mode.toLowerCase()+'?',(miss?miss+' uncounted items will stay unchanged. ':'')+'Counted by '+n[0]+' and '+n[1]+'.',()=>{
  const dd=nowD(),tm=nowT(),t=dd+' '+tm,sh=[],all=[];
  ids.forEach(i=>{const b=i.qty,v=num(d.v[i.id]);i.qty=v;
   S.log.push({t,d:dd,tm,type:mode,user:U.n,p1:n[0],p2:n[1],item:i.name,before:b,after:v,delta:v-b,note:d.note||''});
   all.push({item:i.name,cat:i.cat,unit:i.unit,par:i.par,system:b,counted:v});if(v<b)sh.push({item:i.name,unit:i.unit,system:b,counted:v,short:b-v})});
  S.lastShort={t,d:dd,tm,type:mode,p1:n[0],p2:n[1],rows:sh};S.lastCount={d:dd,tm,type:mode,p1:n[0],p2:n[1],note:d.note||'',rows:all};
  delete S.drafts[mode];save();tab='short';draw();toast('Stock take saved')},'Complete stock take')}

function recv(){const d=S.drafts.recv=S.drafts.recv||{v:{},ref:'',sup:''};
 return `<h3>Stock received</h3><p class="mu">Log a delivery. Quantities are added to stock when you complete. Date and time are added automatically.</p>
 <div class="bar"><span class="stamp clk"></span></div>
 <div class="bar"><select onchange="S.drafts.recv.type=this.value;save()">${['Delivery','Opening balance'].map(t=>`<option ${(d.type||'Delivery')===t?'selected':''}>${t}</option>`).join('')}</select>
 <input type="text" placeholder="Supplier" value="${esc(d.sup||'')}" oninput="S.drafts.recv.sup=this.value;save()">
 <input type="text" placeholder="Invoice / delivery ref" value="${esc(d.ref||'')}" oninput="S.drafts.recv.ref=this.value;save()"></div>
 <div class="tw"><table><tr><th>Item</th><th>On hand</th><th>Received</th><th>New total</th></tr>
 ${S.items.map(i=>{const r=d.v[i.id]??'';return `<tr><td>${esc(i.name)}<div class="mu">${esc(i.cat)} · ${esc(i.unit)}</div></td><td>${i.qty}</td>
 <td><input type="number" step="any" min="0" value="${r}" oninput="rin(${i.id},this.value)"></td><td id="r${i.id}">${r===''?'–':i.qty+num(r)}</td></tr>`}).join('')||'<tr><td colspan="4" class="mu">No products yet. An admin can add them under Stock.</td></tr>'}</table></div>
 <div class="bar"><button class="b o" onclick="saveRecv()">Save draft</button><button class="b" onclick="completeRecv()">Complete stock received</button></div>
 <div class="mu" id="rs">${d.saved?'Draft saved '+d.saved:''}</div>`}
function rin(id,v){S.drafts.recv.v[id]=v;save();const i=S.items.find(x=>x.id===id),el=$('r'+id);if(i&&el)el.textContent=v===''?'–':i.qty+num(v)}
function saveRecv(){S.drafts.recv.saved=nowD()+' '+nowT();save();$('rs').textContent='Draft saved '+S.drafts.recv.saved;toast('Draft saved')}
function completeRecv(){const d=S.drafts.recv;
 if(S.items.some(i=>num(d.v[i.id])<0)){toast('Quantities cannot be negative',1);return}
 const ids=S.items.filter(i=>num(d.v[i.id])>0);if(!ids.length){toast('Enter at least one received quantity first',1);return}
 ask('Add '+ids.length+' item'+(ids.length>1?'s':'')+' to stock?','This updates stock and History straight away.',()=>{
  const dd=nowD(),tm=nowT(),note=[d.sup,d.ref].filter(Boolean).join(' · '),ty=d.type==='Opening balance'?'Opening balance':'Stock received';
  ids.forEach(i=>{const v=num(d.v[i.id]),b=i.qty;i.qty=b+v;S.log.push({t:dd+' '+tm,d:dd,tm,type:ty,user:U.n,item:i.name,before:b,after:i.qty,delta:v,note})});
  delete S.drafts.recv;hf='All';save();tab='log';draw();toast(ty+' saved')},'Add to stock')}

function short(){const L=S.items.filter(i=>i.qty<i.par),ls=S.lastShort;
 return `<h3>Short list</h3>${shiftPicker()}<p class="mu">Everything below par, and how much to order.</p>
 <div class="tw"><table><tr><th>Item</th><th>Category</th><th>On hand</th><th>Par</th><th>Order</th></tr>
 ${L.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.cat}</td><td class="${low(i)?'low':''}">${i.qty} ${i.unit}</td><td>${i.par}</td><td><b>${i.par-i.qty} ${i.unit}</b></td></tr>`).join('')||'<tr><td colspan="5" class="mu">Nothing is short.</td></tr>'}</table></div>
 <h3 style="margin-top:20px">Short in last stock take</h3>
 ${ls?`<p class="mu">${ls.type} · ${ls.d||ls.t} ${ls.tm||''} · Counted by ${esc(ls.p1||'')} and ${esc(ls.p2||'')}</p><div class="tw"><table><tr><th>Item</th><th>System</th><th>Counted</th><th>Short by</th></tr>
 ${ls.rows.map(r=>`<tr><td>${esc(r.item)}</td><td>${r.system}</td><td>${r.counted}</td><td class="neg">${r.short} ${r.unit}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">Nothing was short.</td></tr>'}</table></div>`:'<p class="mu">No stock take completed yet.</p>'}
 <div class="bar"><button class="b o" onclick="exportShort()">Download short list</button><button class="b o" onclick="print()">Print</button></div>`}

function stock(){return `<h3>Stock</h3><div class="bar">${U.admin?'<button class="b" onclick="itemForm()">Add product</button>':''}<button class="b o" onclick="exportStock()">Download stock sheet</button></div>
 <div class="tw"><table><tr><th>Item</th><th>Category</th><th>On hand</th><th>Par</th><th>Status</th>${U.admin?'<th></th>':''}</tr>
 ${S.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.cat)}</td><td>${i.qty} ${esc(i.unit)}</td><td>${i.par}</td><td class="${low(i)?'low':'ok'}">${low(i)?'Low':'OK'}</td>
 ${U.admin?`<td style="white-space:nowrap"><button class="b o s" onclick="itemForm(${i.id})">Edit</button> <button class="b d s" onclick="delItem(${i.id})">Remove</button></td>`:''}</tr>`).join('')||`<tr><td colspan="6" class="mu">No products yet.${U.admin?' Tap Add product.':''}</td></tr>`}</table></div>`}
function itemForm(id){const i=id?S.items.find(x=>x.id===id):null;
 form(i?'Edit product':'Add product',[{k:'name',label:'Product name',val:i?i.name:''},{k:'cat',label:'Category',val:i?i.cat:'',list:'cats'},{k:'unit',label:'Unit (g, pcs, ml)',val:i?i.unit:'pcs'},
 {k:'par',label:'Par level (full stock)',type:'number',val:i?i.par:''},{k:'qty',label:i?'On hand (a change is logged in History)':'Opening quantity',type:'number',val:i?i.qty:0}],v=>{
  if(!v.name){toast('Enter a product name',1);return false}
  if(S.items.some(x=>x.id!==id&&x.name.toLowerCase()===v.name.toLowerCase())){toast('That product already exists',1);return false}
  if(v.par===''||num(v.par)<0||num(v.qty)<0){toast('Par and quantity must be 0 or more',1);return false}
  const dd=nowD(),tm=nowT(),q=num(v.qty);
  if(i){const b=i.qty;Object.assign(i,{name:v.name,cat:v.cat||'Other',unit:v.unit||'pcs',par:num(v.par),qty:q});
   if(q!==b)S.log.push({t:dd+' '+tm,d:dd,tm,type:'Adjustment',user:U.n,item:i.name,before:b,after:q,delta:q-b,note:'Edited by admin'})}
  else{const n={id:S.nid++,name:v.name,cat:v.cat||'Other',unit:v.unit||'pcs',par:num(v.par),qty:q};S.items.push(n);
   if(q>0)S.log.push({t:dd+' '+tm,d:dd,tm,type:'Opening balance',user:U.n,item:n.name,before:0,after:q,delta:q,note:'Added by admin'})}
  save();draw();toast(i?'Product updated':'Product added')},i?'Save changes':'Add product')}
function delItem(id){const i=S.items.find(x=>x.id===id);if(!i)return;
 ask('Remove '+i.name+'?','It is removed from stock, counts and sheets. Past History entries stay.',()=>{
  S.items=S.items.filter(x=>x.id!==id);Object.values(S.drafts).forEach(d=>{if(d&&d.v)delete d.v[id]});save();draw();toast('Product removed')},'Remove')}

function shifts(){return `<h3>Shifts</h3><p class="mu">Tick the days each person works.</p>
 <div class="tw"><table><tr><th>Name</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}${U.admin?'<th></th>':''}</tr>
 ${S.staff.map((s,k)=>`<tr><td>${esc(s.name)}</td>${s.days.map((on,d)=>`<td><input class="chk" type="checkbox" ${on?'checked':''} ${U.admin?'':'disabled'} onchange="S.staff[${k}].days[${d}]=this.checked;save()"></td>`).join('')}
 ${U.admin?`<td style="white-space:nowrap"><button class="b o s" onclick="staffForm(${k})">Rename</button> <button class="b d s" onclick="delStaff(${k})">Remove</button></td>`:''}</tr>`).join('')||`<tr><td colspan="9" class="mu">No staff added yet.</td></tr>`}</table></div>
 ${U.admin?'<div class="bar"><button class="b" onclick="staffForm()">Add staff member</button></div>':''}`}
function staffForm(k){const s=k==null?null:S.staff[k];
 form(s?'Rename staff member':'Add staff member',[{k:'name',label:'Name',val:s?s.name:''}],v=>{
  if(!v.name){toast('Enter a name',1);return false}
  if(S.staff.some((x,j)=>j!==k&&x.name.toLowerCase()===v.name.toLowerCase())){toast('That name already exists',1);return false}
  if(s)s.name=v.name;else S.staff.push({name:v.name,days:Array(7).fill(false)});save();draw();toast('Saved')},s?'Save':'Add')}
function delStaff(k){const s=S.staff[k];if(!s)return;ask('Remove '+s.name+'?','They are removed from Shifts. Past History keeps their name.',()=>{S.staff.splice(k,1);save();draw();toast('Staff member removed')},'Remove')}

function hist(){const F=S.log.filter(l=>hf==='All'||l.type===hf);return `<h3>History</h3><div class="bar"><select onchange="hf=this.value;draw()">${['All','Stock received','Opening balance','Opening count','Closing count','Adjustment'].map(t=>`<option ${t===hf?'selected':''}>${t}</option>`).join('')}</select><button class="b o" onclick="exportHistory()">Download history</button></div>
 <div class="tw"><table><tr><th>Date</th><th>Time</th><th>Type</th><th>Counted by</th><th>Item</th><th>Before</th><th>After</th><th>Change</th><th>Note</th></tr>
 ${F.slice().reverse().slice(0,300).map(l=>`<tr><td>${l.d||l.t}</td><td>${l.tm||''}</td><td>${l.type}</td><td>${l.p1?esc(l.p1)+' &amp; '+esc(l.p2):''}</td><td>${esc(l.item)}</td><td>${l.before}</td><td>${l.after}</td><td class="${l.delta<0?'neg':l.delta>0?'pos':''}">${l.delta>0?'+':''}${l.delta}</td><td>${esc(l.note||'')}</td></tr>`).join('')||'<tr><td colspan="10" class="mu">No counts yet.</td></tr>'}</table></div>`}

function admin(){return `<h3>Admin</h3>
 <h3 style="margin-top:18px;font-size:17px">Products</h3><div class="bar"><button class="b" onclick="itemForm()">Add product</button><button class="b o" onclick="tab='stock';draw()">Edit or remove products</button></div>
 <h3 style="margin-top:18px;font-size:17px">Staff</h3>
 <div class="tw"><table>${S.staff.map((s,k)=>`<tr><td>${esc(s.name)}</td><td style="text-align:right;white-space:nowrap"><button class="b o s" onclick="staffForm(${k})">Rename</button> <button class="b d s" onclick="delStaff(${k})">Remove</button></td></tr>`).join('')||'<tr><td class="mu">No staff added yet.</td></tr>'}</table></div>
 <div class="bar"><button class="b" onclick="staffForm()">Add staff member</button></div>
 <h3 style="margin-top:18px;font-size:17px">PINs</h3>
 <div class="bar"><span>Admin PIN</span><input type="text" id="pa" value="${esc(S.pins.admin)}" maxlength="6" style="width:100px">
 <span>Staff PIN</span><input type="text" id="ps" value="${esc(S.pins.staff)}" maxlength="6" style="width:100px"><button class="b" onclick="savePins()">Save PINs</button></div>
 <h3 style="margin-top:18px;font-size:17px">Backup</h3><p class="mu">Download a backup regularly. Restore it on any device.</p>
 <div class="bar"><button class="b" onclick="backup()">Download backup</button><button class="b o" onclick="exportXlsx()">Download full records (Excel)</button><label class="b o">Restore backup<input type="file" accept=".json" class="hide" onchange="restore(this.files[0])"></label></div>
 <h3 style="margin-top:18px;font-size:17px">Recover data</h3><p class="mu">The portal keeps automatic daily snapshots on this device.</p>
 <div class="tw"><table>${snapList().map(x=>`<tr><td>${esc(x.label)}</td><td style="text-align:right"><button class="b o s" onclick="restoreSnap(${x.k})">Restore</button></td></tr>`).join('')||'<tr><td class="mu">No snapshots yet.</td></tr>'}</table></div>
 <h3 style="margin-top:18px;font-size:17px">Danger zone</h3>
 <div class="bar"><button class="b d" onclick="ask('Clear all history?','This cannot be undone. Stock levels stay as they are.',()=>{S.log=[];S.lastShort=null;S.lastCount=null;save();draw();toast('History cleared')},'Clear history')">Clear history</button>
 <button class="b d" onclick="ask('Reset everything?','All products, stock, staff, history and PINs go back to defaults.',()=>{S=seed();save();draw();toast('Reset to defaults')},'Reset all')">Reset all data</button></div>`}
function savePins(){const a=$('pa').value.trim(),s=$('ps').value.trim();if(a.length<4||s.length<4||a===s){toast('PINs need 4+ characters and must differ',1);return}S.pins={admin:a,staff:s};save();toast('PINs saved')}

const nowD=()=>new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),nowT=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const BD={top:{style:'thin',color:{rgb:'BFD3C6'}},bottom:{style:'thin',color:{rgb:'BFD3C6'}},left:{style:'thin',color:{rgb:'BFD3C6'}},right:{style:'thin',color:{rgb:'BFD3C6'}}};
const ST={title:{font:{bold:true,sz:20,color:{rgb:'14532D'}},alignment:{vertical:'center'}},mb:{font:{bold:true,sz:13}},m:{font:{sz:13}},
 th:{font:{bold:true,sz:13,color:{rgb:'FFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:'1F7A4D'}},alignment:{vertical:'center',wrapText:true},border:BD},
 td:{font:{sz:13},alignment:{vertical:'center',wrapText:true},border:BD},tdz:{font:{sz:13},fill:{patternType:'solid',fgColor:{rgb:'F3F9F5'}},alignment:{vertical:'center',wrapText:true},border:BD},
 bad:{font:{sz:13,bold:true,color:{rgb:'C0392B'}},fill:{patternType:'solid',fgColor:{rgb:'FDECEA'}},alignment:{vertical:'center',wrapText:true},border:BD}};
function mk(title,meta,head,rows,w,flag){
 const A=[[title],...meta,[],head,...rows],hr=meta.length+2,nc=head.length,ws=XLSX.utils.aoa_to_sheet(A);
 ws['!cols']=w.map(x=>({wch:x}));ws['!rows']=A.map((_,r)=>({hpt:r===0?34:r===hr?30:24}));
 ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:nc-1}}];
 const set=(r,c,st)=>{const a=XLSX.utils.encode_cell({r,c});if(!ws[a])ws[a]={t:'s',v:''};ws[a].s=st};
 set(0,0,ST.title);meta.forEach((_,i)=>{set(i+1,0,ST.mb);set(i+1,1,ST.m)});
 head.forEach((_,c)=>set(hr,c,ST.th));
 rows.forEach((r,i)=>{const st=flag&&flag(r)?ST.bad:(i%2?ST.tdz:ST.td);head.forEach((_,c)=>set(hr+1+i,c,st))});
 return ws}
const head3=()=>[['Date',nowD()],['Time',nowT()]];
const nm=(a,b)=>[['Counted by',(a||'')+(b?' and '+b:'')]];
function takeSheet(type,d,tm,p1,p2,note,rows){
 return mk('Kush Collective – '+type,[['Date',d],['Time',tm||''],['Counted by (person 1)',p1||'Not recorded'],['Counted by (person 2)',p2||'Not recorded'],['Note',note||'']],
  ['Item','Unit','System','Counted','Variance','Result'],
  rows.map(r=>{const c=r.counted===''||r.counted==null?'':r.counted,v=c===''?'':c-r.system;return [r.item,r.unit,r.system,c,v,v===''?'Not counted':v<0?'SHORT '+(-v):v>0?'Over +'+v:'OK']}),
  [34,9,11,11,11,16],r=>String(r[5]).startsWith('SHORT'))}
function save_(wb,name){XLSX.writeFile(wb,name+'-'+new Date().toISOString().slice(0,10)+'.xlsx')}
function exportCount(){const d=dk(),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,takeSheet(mode,nowD(),nowT(),(d.p1||'').trim(),(d.p2||'').trim(),d.note,S.items.map(i=>({item:i.name,cat:i.cat,unit:i.unit,par:i.par,system:i.qty,counted:d.v[i.id]===undefined||d.v[i.id]===''?'':num(d.v[i.id])}))),'Stock take');
 save_(wb,'Kush-'+mode.replace(/ /g,'-'))}
const ex=()=>[['Exported',nowD()+' '+nowT()]];
const wsStock=()=>mk('Kush Collective – Stock',ex(),['Item','Category','Unit','On hand','Par','Status','Order qty'],S.items.map(i=>[i.name,i.cat,i.unit,i.qty,i.par,low(i)?'LOW':i.qty<i.par?'Below par':'OK',Math.max(0,i.par-i.qty)]),[34,16,9,11,9,13,11],r=>r[5]==='LOW');
const wsShort=()=>mk('Kush Collective – Short list',ex(),['Item','Category','Unit','On hand','Par','Order qty'],S.items.filter(i=>i.qty<i.par).map(i=>[i.name,i.cat,i.unit,i.qty,i.par,i.par-i.qty]),[34,16,9,11,9,11]);
const wsHist=()=>mk('Kush Collective – History',ex(),['Date','Time','Type','Counted by','Item','Before','After','Change','Note','Entered by'],
 S.log.slice().reverse().map(l=>[l.d||l.t,l.tm||'',l.type,l.p1?l.p1+' and '+l.p2:'',l.item,l.before,l.after,l.delta,l.note||'',l.user]),[14,9,18,26,30,9,9,9,26,12],r=>/count/.test(r[2])&&r[7]<0);
const wsShifts=()=>mk('Kush Collective – Shifts',ex(),['Name',...DAYS],S.staff.map(s=>[s.name,...s.days.map(x=>x?'Yes':'')]),[22,8,8,8,8,8,8,8]);
function dl(name,parts){const wb=XLSX.utils.book_new();parts.forEach(p=>XLSX.utils.book_append_sheet(wb,p[1](),p[0]));save_(wb,name)}
const exportStock=()=>dl('Kush-Stock',[['Stock',wsStock]]);
const exportShort=()=>dl('Kush-Short-list',[['Short list',wsShort]]);
const exportHistory=()=>dl('Kush-History',[['History',wsHist]]);
const exportXlsx=()=>dl('Kush-Full-records',[['Stock',wsStock],['Short list',wsShort],['History',wsHist],['Shifts',wsShifts]]);

function sessions(){const out=[];let cur=null;
 S.log.forEach(l=>{if(l.type!=='Opening count'&&l.type!=='Closing count'){cur=null;return}
  const k=[l.d||l.t,l.tm||'',l.type,l.p1||'',l.p2||''].join('|');
  if(!cur||cur.k!==k){cur={k,d:l.d||l.t,tm:l.tm||'',type:l.type,p1:l.p1||'',p2:l.p2||'',note:l.note||'',rows:[]};out.push(cur)}
  const it=S.items.find(i=>i.name===l.item);cur.rows.push({item:l.item,cat:it?it.cat:'',unit:it?it.unit:'',par:it?it.par:'',system:l.before,counted:l.after})});
 return out}
const dayList=()=>[...new Set(sessions().map(x=>x.d))];
function shiftPicker(){const ss=sessions();
 if(!ss.length)return '<div class="card" style="margin:14px 0"><div style="font-weight:700">Download shift counts</div><div class="mu">Complete a stock take to download its counts.</div></div>';
 const days=dayList();
 return `<div class="card" style="margin:14px 0"><div style="font-weight:700;margin-bottom:4px">Download shift counts</div>
 <div class="mu" style="margin-bottom:8px">Counts only for the shift you pick. Stock received is not included.</div>
 <div class="bar" style="margin:0"><select id="shsel" style="flex:1;min-width:200px">${ss.map((x,i)=>`<option value="s${i}">${esc(x.d)} · ${esc(x.tm)} · ${esc(x.type)}${x.p1?' · '+esc(x.p1)+' &amp; '+esc(x.p2):''}</option>`).reverse().join('')}
 ${days.map((d,i)=>`<option value="d${i}">All counts on ${esc(d)}</option>`).reverse().join('')}</select>
 <button class="b" onclick="downloadShift()">Download</button></div></div>`}
function shiftBook(list,name){const wb=XLSX.utils.book_new(),used={};
 list.forEach(se=>{const n=(se.type+' '+se.tm).replace(/[:\\\/?*\[\]]/g,'.').trim().slice(0,28);let k=n,c=2;while(used[k])k=n+' '+c++;used[k]=1;
  XLSX.utils.book_append_sheet(wb,takeSheet(se.type,se.d,se.tm,se.p1,se.p2,se.note,se.rows),k)});
 XLSX.writeFile(wb,name.replace(/[^\w-]+/g,'-')+'.xlsx')}
function downloadShift(){const v=$('shsel').value,ss=sessions();
 if(v[0]==='s'){const se=ss[+v.slice(1)];if(se)shiftBook([se],'Kush-'+se.type+'-'+se.d+'-'+se.tm)}
 else{const d=dayList()[+v.slice(1)];shiftBook(ss.filter(x=>x.d===d),'Kush-Counts-'+d)}}
setInterval(tickClk,10000);
if(locked)showLock();
addEventListener('storage',e=>{if(e.key!=='kush_v2'||!e.newValue||!U)return;try{const d=migrate(JSON.parse(e.newValue));if(!d)return;S=d}catch(x){return}
 const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)||$('dlg').open)return;draw()});
try{const u=sessionStorage.getItem('kushU');if(u){U=JSON.parse(u);$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=U.n;draw()}}catch(e){}
</script></body></html>
